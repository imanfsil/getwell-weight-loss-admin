<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Getwell</title><link rel="stylesheet" href="styles.css?v=20260824-darkfix"><script src="app.js?v=20260824-darkfix"></script></head><body><div id="root"></div><script>
const ds=getwellDashboardSettings();const ps=store().patients;const al=alerts();const panel=ps.filter(patientUsesPanel);let g=0,c=0;panel.forEach(p=>{const f=finance(p);g+=f.grand;c+=f.claimed});document.getElementById("root").innerHTML=shell("Dashboard","dashboard",`
<div class="page-head"><div><h1>Dashboard</h1><p>Weight Loss Program Management</p></div></div>
<div class="kpi-grid">
${ds.showTotalPatients!==false?`<div class="kpi"><div class="kpi-label">TOTAL PATIENTS</div><div class="kpi-value">${ps.length}</div><div class="kpi-sub">All registered patients</div></div>`:""}
${ds.showActivePatients!==false?`<div class="kpi"><div class="kpi-label">ACTIVE PATIENTS</div><div class="kpi-value">${ps.filter(p=>p.status==="Active").length}</div><div class="kpi-sub">Currently in program</div></div>`:""}
${ds.showDueFollowUp!==false?`<div class="kpi"><div class="kpi-label">DUE FOLLOW-UP</div><div class="kpi-value">${al.length}</div><div class="kpi-sub">5+ days since visit</div></div>`:""}
${ds.showPanelPatients!==false?`<div class="kpi"><div class="kpi-label">PANEL PATIENTS</div><div class="kpi-value">${panel.length}</div><div class="kpi-sub">Using panel / insurance</div></div>`:""}
</div>
<div class="grid-2">
${ds.showAttention!==false?`<div class="card"><div class="card-head"><div><h2>Patients Needing Attention</h2><p>5 days due · 7 days overdue</p></div></div><div>${al.slice(0,8).map(a=>`<div class="row"><span class="notif-dot ${a.level}"></span><div class="row-main"><div class="row-title">${escapeHtml(a.name)}</div><div class="row-sub">${a.days} days since last visit</div></div><a class="secondary" style="padding:7px 9px" href="patient-profile.html?patient=${encodeURIComponent(a.id)}">Open</a></div>`).join("")||`<div class="notif-empty">No follow-up alerts.</div>`}</div></div>`:""}
${ds.showPanelClaimOverview!==false?`<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Panel Claim Overview</h2><p>Current claim workload</p></div><a class="secondary" style="padding:7px 9px" href="panel.html">Open Panel</a></div><div class="card-body"><div class="finance-grid"><div class="finance-card"><div class="label">GRAND TOTAL</div><div class="value">${money(g)}</div></div><div class="finance-card"><div class="label">TOTAL CLAIMED</div><div class="value">${money(c)}</div></div><div class="finance-card balance"><div class="label">BALANCE TO CLAIM</div><div class="value">${money(Math.max(0,g-c))}</div></div></div></div></div>`:""}
</div>
`);renderNotifications();
</script></body></html>
