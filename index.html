<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dashboard | Getwell</title><link rel="stylesheet" href="styles.css?v=20260825-premium"><script src="app.js?v=20260825-premium"></script></head><body><div id="root"></div><script>

/* =========================================================
   GETWELL DASHBOARD

   Layout follows the approved design. Every number on this
   page is read from the existing store — patients, visits,
   appointments and claims — and every Settings toggle that
   controlled this page before still controls it now.
========================================================= */

const ds = getwellDashboardSettings();
const ps = store().patients || [];
const al = alerts();
const followUpConfig = getwellFollowUpSettings();

const panelPatients = ps.filter(patientUsesPanel);
let panelGrand = 0, panelClaimed = 0;
panelPatients.forEach(patient => {
  const f = finance(patient);
  panelGrand += f.grand;
  panelClaimed += f.claimed;
});

const todayKey = new Date().toISOString().slice(0,10);


/* ---------------------------------------------------------
   ICONS
--------------------------------------------------------- */

const ICONS = {
  people:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="9" cy="7" r="3.2"/><path d="M22 20v-1.5a4 4 0 0 0-3-3.87"/><path d="M16.5 4.2a4 4 0 0 1 0 7.6"/></svg>`,
  person:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20v-1.5a5 5 0 0 0-5-5h-4a5 5 0 0 0-5 5V20"/><circle cx="12" cy="7" r="3.6"/></svg>`,
  clock:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4"/><path d="M12 12.6v2.6l1.8 1.1"/></svg>`,
  shield:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 4.5 6v6c0 4.4 3.1 8.2 7.5 9.3 4.4-1.1 7.5-4.9 7.5-9.3V6Z"/><path d="m9 12.2 2.2 2.2L15.4 10"/></svg>`,
  calendar:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4"/></svg>`,
  chart:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17.5 9 11l4 3.6 7.2-7.4"/><path d="M15.4 7.2h4.8V12"/></svg>`,
  clipboard:`<svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.6" width="16" height="18.4" rx="3" fill="rgba(255,255,255,.16)"/><rect x="8.4" y="1.6" width="7.2" height="4" rx="1.6" fill="rgba(255,255,255,.30)"/><circle cx="12" cy="11" r="2.4" fill="rgba(255,255,255,.30)"/><path d="M7.8 18.2a4.2 4.2 0 0 1 8.4 0"/></svg>`
};

const kpiIcon = (name, tone) =>
  `<div class="kpi-icon ${tone}">${ICONS[name]}</div>`;


/* ---------------------------------------------------------
   KPI CARDS
   All four sit in one grid track each, so they are exactly
   the same width and stretch to the same height.
--------------------------------------------------------- */

const newThisMonth = ps.filter(p => String(p.startDate || "").slice(0,7) === todayKey.slice(0,7)).length;
const activeCount = ps.filter(p => p.status === "Active").length;
const overdueCount = al.filter(a => a.level === "overdue").length;

const kpiCards = [
  ds.showTotalPatients !== false ? `
    <div class="kpi">
      ${kpiIcon("people","")}
      <div class="kpi-main">
        <div class="kpi-label">TOTAL PATIENTS</div>
        <div class="kpi-value">${ps.length}</div>
        <div class="kpi-sub${newThisMonth ? " up" : ""}">${newThisMonth ? "↑ " + newThisMonth + " new this month" : "All registered patients"}</div>
      </div>
    </div>` : "",

  ds.showActivePatients !== false ? `
    <div class="kpi">
      ${kpiIcon("person","green")}
      <div class="kpi-main">
        <div class="kpi-label">ACTIVE PATIENTS</div>
        <div class="kpi-value">${activeCount}</div>
        <div class="kpi-sub">Currently in program</div>
      </div>
    </div>` : "",

  ds.showDueFollowUp !== false ? `
    <div class="kpi">
      ${kpiIcon("clock","amber")}
      <div class="kpi-main">
        <div class="kpi-label">DUE FOLLOW-UP</div>
        <div class="kpi-value">${al.length}</div>
        <div class="kpi-sub${overdueCount ? " warn" : ""}">${overdueCount ? "● Requires attention" : followUpConfig.dueAfterDays + "+ days since visit"}</div>
      </div>
    </div>` : "",

  ds.showPanelPatients !== false ? `
    <div class="kpi">
      ${kpiIcon("shield","violet")}
      <div class="kpi-main">
        <div class="kpi-label">PANEL PATIENTS</div>
        <div class="kpi-value">${panelPatients.length}</div>
        <div class="kpi-sub link">Using panel / insurance</div>
      </div>
    </div>` : ""
].join("");


/* ---------------------------------------------------------
   TODAY'S APPOINTMENTS
--------------------------------------------------------- */

function todaysAppointments(){
  const rows = [];

  ps.forEach(patient => {
    (patient.appointments || []).forEach(appointment => {
      if(!appointment || appointment.date !== todayKey) return;
      rows.push({
        time: appointment.time || "",
        status: appointment.status || "Upcoming",
        type: appointment.type || "Appointment",
        patient
      });
    });
  });

  return rows.sort((a,b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
}

function formatTime(value){
  const match = String(value || "").match(/^(\d{1,2}):(\d{2})/);
  if(!match) return "—";

  let hour = Number(match[1]);
  const suffix = hour >= 12 ? "PM" : "AM";
  hour = hour % 12 || 12;

  return `${String(hour).padStart(2,"0")}:${match[2]} ${suffix}`;
}

const appointmentsToday = todaysAppointments();

const appointmentsCard = getwellFeatureEnabled("appointments") ? `
  <div class="card">
    <div class="card-head">
      <div><h2>Today's Appointments</h2><p>${appointmentsToday.length} scheduled for today</p></div>
      <a class="card-link" href="appointments.html">View all</a>
    </div>

    <div>
      ${appointmentsToday.slice(0,5).map(row => `
        <div class="row" role="button" tabindex="0"
             onclick="location.href='patient-profile.html?patient=${encodeURIComponent(row.patient.id)}'"
             onkeydown="if(event.key==='Enter'){location.href='patient-profile.html?patient=${encodeURIComponent(row.patient.id)}'}">
          <span class="slot-time">${formatTime(row.time)}</span>
          <div class="row-main">
            <div class="row-title">${escapeHtml(row.patient.name || row.patient.id)}</div>
            <div class="row-sub">${escapeHtml(row.patient.id)} · ${escapeHtml(row.type)}</div>
          </div>
          <span class="badge ${row.status === "Completed" ? "green" : row.status === "No Show" ? "red" : row.status === "Cancelled" ? "gray" : "blue"}">${escapeHtml(row.status)}</span>
        </div>
      `).join("") || `<div class="notif-empty">No appointments scheduled for today.</div>`}
    </div>

    <a class="card-foot-link" href="appointments.html">${ICONS.calendar} View Full Calendar</a>
  </div>
` : "";


/* ---------------------------------------------------------
   PATIENTS DUE FOR FOLLOW-UP
   Uses the existing alerts() calculation unchanged.
--------------------------------------------------------- */

function overdueLabel(alert){
  const over = alert.days - followUpConfig.dueAfterDays;
  if(over <= 0) return "Due today";
  return over + (over === 1 ? " day overdue" : " days overdue");
}

const followUpCard = ds.showAttention !== false ? `
  <div class="card">
    <div class="card-head">
      <div><h2>Patients Due for Follow-Up</h2><p>${followUpConfig.dueAfterDays} days due · ${followUpConfig.overdueAfterDays} days overdue</p></div>
      <a class="card-link" href="patients.html">View all</a>
    </div>

    <div>
      ${al.slice(0,5).map(alert => {
        const patient = getPatient(alert.id) || {id:alert.id, name:alert.name};
        return `
        <div class="row" role="button" tabindex="0"
             onclick="location.href='patient-profile.html?patient=${encodeURIComponent(alert.id)}'"
             onkeydown="if(event.key==='Enter'){location.href='patient-profile.html?patient=${encodeURIComponent(alert.id)}'}">
          <span class="avatar-small">${getwellPatientAvatar(patient)}</span>
          <div class="row-main">
            <div class="row-title">${escapeHtml(alert.name || alert.id)}</div>
            <div class="row-sub">${escapeHtml(alert.id)} · Last visit: ${alert.days} days ago</div>
          </div>
          <span class="follow-flag ${alert.level}">${escapeHtml(overdueLabel(alert))}</span>
        </div>`;
      }).join("") || `<div class="notif-empty">No follow-up alerts.</div>`}
    </div>

    <a class="card-foot-link" href="patients.html">${ICONS.chart} View All Follow-Ups</a>
  </div>
` : "";


/* ---------------------------------------------------------
   PROGRAMME OVERVIEW
--------------------------------------------------------- */

function programmeCardHtml(range){
  const data = getwellProgrammeOverview(range);

  const hasAverage = data.avgChange !== null && data.patients > 0;
  const gained = hasAverage && data.avgChange > 0;

  const delta = (data.deltaKg === null || data.deltaKg === undefined)
    ? ""
    : `<span class="prog-delta${data.deltaKg > 0 ? " up" : ""}">${data.deltaKg <= 0 ? "↓" : "↑"} ${Math.abs(data.deltaKg).toFixed(1)} kg</span>`;

  return `
    <div class="card-head">
      <div><h2>Programme Overview</h2><p>Across ${data.patients} patient${data.patients === 1 ? "" : "s"} with a recorded start weight</p></div>
      <select class="prog-select" id="progRange" onchange="renderProgramme(this.value)" aria-label="Programme period">
        <option value="month"${range === "month" ? " selected" : ""}>This Month</option>
        <option value="quarter"${range === "quarter" ? " selected" : ""}>Last 3 Months</option>
        <option value="all"${range === "all" ? " selected" : ""}>All Time</option>
      </select>
    </div>

    <div class="card-body">
      <div class="prog-head">
        <div>
          <div class="kpi-label">AVERAGE WEIGHT CHANGE</div>
          <div class="prog-metric">
            <span class="prog-value" style="color:${hasAverage && !gained ? "var(--green)" : "var(--navy)"}">${hasAverage ? (data.avgChange > 0 ? "+" : "") + data.avgChange.toFixed(2) : "—"}</span>
            <span class="prog-unit">kg</span>
          </div>
        </div>
        <div>
          ${delta}
          ${delta ? `<div class="prog-note">vs previous period</div>` : ""}
        </div>
      </div>

      ${getwellRenderMiniChart(data.series)}

      <div class="prog-split">
        <div class="prog-tile">
          <div class="label">Goals Achieved</div>
          <div class="value good">${data.goalsAchieved}</div>
        </div>
        <div class="prog-tile">
          <div class="label">On Track</div>
          <div class="value info">${data.onTrack}</div>
        </div>
      </div>
    </div>

    ${getwellFeatureEnabled("reports") ? `<a class="card-foot-link" href="reports.html">${ICONS.chart} View Reports</a>` : ""}
  `;
}

function renderProgramme(range){
  const card = document.getElementById("progCard");
  if(card) card.innerHTML = programmeCardHtml(range);
}


/* ---------------------------------------------------------
   RECENT PATIENTS
--------------------------------------------------------- */

function progressPercent(patient){
  const start = Number(patient.startingWeight) || 0;
  const goal = Number(patient.goalWeight) || 0;
  const current = Number(patient.currentWeight) || start;

  if(!start || !goal || start <= goal) return null;

  const percent = ((start - current) / (start - goal)) * 100;
  return Math.max(0, Math.min(100, Math.round(percent)));
}

const recentPatients = ps.slice().sort((a,b) =>
  String(b.startDate || "").localeCompare(String(a.startDate || ""))
).slice(0,6);

const recentCard = getwellFeatureEnabled("patients") ? `
  <div class="card">
    <div class="card-head">
      <div><h2>Recent Patients</h2><p>Newest programme starts</p></div>
      <a class="card-link" href="patients.html">View all patients</a>
    </div>

    <div class="table-wrap">
      <table class="table compact">
        <thead>
          <tr>
            <th>Patient ID</th><th>Name</th><th>Program Start</th>
            <th>Current</th><th>Goal</th><th>Progress</th><th>Status</th><th></th>
          </tr>
        </thead>
        <tbody>
          ${recentPatients.map(patient => {
            const percent = progressPercent(patient);
            return `
            <tr>
              <td>${escapeHtml(patient.id || "")}</td>
              <td>
                <div class="cell-patient">
                  <span class="avatar-small">${getwellPatientAvatar(patient)}</span>
                  <span class="cell-patient-text"><strong>${escapeHtml(patient.name || "")}</strong></span>
                </div>
              </td>
              <td>${escapeHtml(patient.startDate || "—")}</td>
              <td>${escapeHtml(String(patient.currentWeight || "—"))} kg</td>
              <td>${escapeHtml(String(patient.goalWeight || "—"))} kg</td>
              <td>
                ${percent === null ? "—" : `
                  <div class="progress-cell">
                    <span class="progress-track"><span class="progress-fill" style="width:${percent}%"></span></span>
                    <span class="progress-value">${percent}%</span>
                  </div>`}
              </td>
              <td><span class="badge ${patient.status === "Active" ? "green" : "gray"}">${escapeHtml(patient.status || "")}</span></td>
              <td><a class="secondary" style="padding:7px 9px" href="patient-profile.html?patient=${encodeURIComponent(patient.id || "")}">Open →</a></td>
            </tr>`;
          }).join("") || `<tr><td colspan="8" class="notif-empty">No patients yet.</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>
` : "";


/* ---------------------------------------------------------
   ADD NEW PATIENT + PANEL CLAIM OVERVIEW
--------------------------------------------------------- */

const ctaCard = getwellFeatureEnabled("patients") ? `
  <a class="cta-card" href="patients.html?add=1">
    <h2>Add New Patient</h2>
    <p>Register a new patient and start their weight loss journey with Getwell.</p>
    <div class="cta-plus" aria-hidden="true">+</div>
    <div class="cta-art" aria-hidden="true">${ICONS.clipboard}</div>
  </a>
` : "";

const panelCard = (ds.showPanelClaimOverview !== false && getwellFeatureEnabled("panel")) ? `
  <div class="card">
    <div class="card-head">
      <div><h2>Panel Claim Overview</h2><p>Current claim workload</p></div>
      <a class="card-link" href="panel.html">Open Panel</a>
    </div>
    <div class="card-body">
      <div class="finance-grid finance-stack">
        <div class="finance-card"><div class="label">GRAND TOTAL</div><div class="value">${money(panelGrand)}</div></div>
        <div class="finance-card"><div class="label">TOTAL CLAIMED</div><div class="value">${money(panelClaimed)}</div></div>
        <div class="finance-card balance"><div class="label">BALANCE TO CLAIM</div><div class="value">${money(Math.max(0, panelGrand - panelClaimed))}</div></div>
      </div>
    </div>
  </div>
` : "";


/* ---------------------------------------------------------
   RENDER
--------------------------------------------------------- */

const dateLabel = new Date().toLocaleDateString("en-GB", {
  weekday:"long", day:"numeric", month:"short", year:"numeric"
});

document.getElementById("root").innerHTML = shell("Dashboard","dashboard",`

  <div class="date-row">
    <span class="date-pill">${ICONS.calendar}${escapeHtml(dateLabel)}</span>
  </div>

  ${kpiCards ? `<div class="kpi-grid">${kpiCards}</div>` : ""}

  <div class="dash-grid">
    ${appointmentsCard}
    ${followUpCard}
    <div class="card prog-card" id="progCard"></div>
  </div>

  <div class="dash-grid-2">
    ${recentCard}
    <div class="dash-side">
      ${ctaCard}
      ${panelCard}
    </div>
  </div>
`);

renderProgramme("month");
renderNotifications();

</script></body></html>
