<!doctype html>

<html>
<head>

<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Dashboard | Getwell</title>

<link
  rel="stylesheet"
  href="styles.css"
>

<script src="app.js"></script>

</head>

<body>

<script>

document.write(
  shell(
    "Dashboard",
    "Weight Loss Program Management",
    "dashboard",
    `
      <div class="page-head">

        <div>
          <h1>
            Good afternoon, Admin
          </h1>

          <p>
            Here's what's happening with the weight loss program today.
          </p>
        </div>

      </div>

      <div
        class="kpi-grid"
        id="dashKpis"
      ></div>

      <div class="grid-2">

        <div class="card">

          <div class="card-head">

            <div>
              <h2>
                Today's Appointments
              </h2>

              <p>
                Upcoming and completed patient appointments.
              </p>
            </div>

          </div>

          <div id="todayList"></div>

        </div>


        <div class="card">

          <div class="card-head">

            <div>
              <h2>
                Patients Needing Attention
              </h2>

              <p>
                Based on latest recorded visit.
              </p>
            </div>

          </div>

          <div id="attentionList"></div>

        </div>

      </div>
    `
  )
);


const s = store();

const ps = s.patients;

const active =
  ps.filter(
    p => p.status === "Active"
  ).length;

const completed =
  ps.filter(
    p => p.status === "Completed"
  ).length;

const inactive =
  ps.filter(
    p => p.status === "Inactive"
  ).length;

const a = alerts();


document.getElementById(
  "dashKpis"
).innerHTML = `

  <div class="kpi">

    <div class="kpi-label">
      TOTAL PATIENTS
    </div>

    <div class="kpi-value">
      ${ps.length}
    </div>

    <div class="kpi-sub">
      All registered patients
    </div>

  </div>


  <div class="kpi">

    <div class="kpi-label">
      ACTIVE PATIENTS
    </div>

    <div class="kpi-value">
      ${active}
    </div>

    <div class="kpi-sub">
      Currently in program
    </div>

  </div>


  <div class="kpi">

    <div class="kpi-label">
      DUE FOLLOW-UP
    </div>

    <div class="kpi-value">
      ${a.length}
    </div>

    <div class="kpi-sub">
      5+ days since visit
    </div>

  </div>


  <div class="kpi">

    <div class="kpi-label">
      GOALS COMPLETED
    </div>

    <div class="kpi-value">
      ${completed}
    </div>

    <div class="kpi-sub">
      ${inactive} inactive patients
    </div>

  </div>

`;


document.getElementById(
  "todayList"
).innerHTML =

  ps
    .slice(0,4)
    .map(
      p => {

        const v =
          latestVisit(p);

        return `
          <div class="row">

            <div class="avatar-small">
              ${p.initials}
            </div>

            <div class="row-main">

              <div class="row-title">
                ${p.name}
              </div>

              <div class="row-sub">
                ${v?.type || "No visit"}
                ·
                ${v?.dateKey || "—"}
              </div>

            </div>

            <a
              class="secondary"
              style="padding:7px 9px"
              href="patient-profile.html?patient=${p.id}"
            >
              View
            </a>

          </div>
        `;
      }
    )
    .join("");


document.getElementById(
  "attentionList"
).innerHTML =

  a.length

    ? a
        .slice(0,6)
        .map(
          x => `
            <div
              class="row"
              onclick="location.href='patient-profile.html?patient=${x.id}'"
            >

              <span
                class="notif-dot ${x.level}"
              ></span>

              <div class="row-main">

                <div class="row-title">
                  ${x.name}
                </div>

                <div class="row-sub">
                  ${
                    x.level === "overdue"
                      ? "Overdue"
                      : "Due for Follow-Up"
                  }
                  ·
                  ${x.days} days
                </div>

              </div>

              →
            </div>
          `
        )
        .join("")

    : `
      <div class="notif-empty">
        No patients need attention.
      </div>
    `;

</script>

</body>
</html>
