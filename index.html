<!doctype html>
<html lang="en">
<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    Dashboard | Getwell Weight Loss Admin
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <script src="app.js"></script>

</head>

<body>

<script>

/* =========================================================
   DASHBOARD
========================================================= */

document.write(

  shell(

    "Dashboard",

    "Weight Loss Program Management",

    "dashboard",

    `

      <div class="page-head">

        <div>

          <h1>
            Good afternoon, Admin
          </h1>

          <p>
            Here's what's happening with the weight loss program today.
          </p>

        </div>

      </div>


      <div
        class="kpi-grid"
        id="dashKpis"
      ></div>


      <div class="grid-2">


        <!-- TODAY'S APPOINTMENTS -->

        <div class="card">

          <div class="card-head">

            <div>

              <h2>
                Today's Appointments
              </h2>

              <p>
                Upcoming and completed patient appointments.
              </p>

            </div>

          </div>

          <div
            id="todayList"
            class="list"
          ></div>

        </div>


        <!-- PATIENTS NEEDING ATTENTION -->

        <div class="card">

          <div class="card-head">

            <div>

              <h2>
                Patients Needing Attention
              </h2>

              <p>
                Based on the latest recorded visit.
              </p>

            </div>

          </div>

          <div
            id="attentionList"
            class="list"
          ></div>

        </div>


      </div>


      <!-- FOLLOW-UP SUMMARY -->

      <div
        class="card"
        style="margin-top:16px"
      >

        <div class="card-head">

          <div>

            <h2>
              Follow-Up Summary
            </h2>

            <p>
              Patients are flagged from the latest recorded visit,
              not their appointment date.
            </p>

          </div>

        </div>


        <div
          id="followUpSummary"
          class="list"
        ></div>

      </div>

    `
  )

);


/* =========================================================
   DASHBOARD DATA
========================================================= */

const dashboardStore =
  store();

const dashboardPatients =
  dashboardStore.patients || [];


const dashboardActive =
  dashboardPatients.filter(
    patient =>
      patient.status === "Active"
  ).length;


const dashboardCompleted =
  dashboardPatients.filter(
    patient =>
      patient.status === "Completed"
  ).length;


const dashboardInactive =
  dashboardPatients.filter(
    patient =>
      patient.status === "Inactive"
  ).length;


const dashboardAlerts =
  alerts();


/* =========================================================
   KPI CARDS
========================================================= */

document.getElementById(
  "dashKpis"
).innerHTML = `


  <!-- TOTAL PATIENTS -->

  <div class="kpi">

    <div class="kpi-label">
      TOTAL PATIENTS
    </div>

    <div class="kpi-value">
      ${dashboardPatients.length}
    </div>

    <div class="kpi-sub">
      All registered patients
    </div>

  </div>


  <!-- ACTIVE PATIENTS -->

  <div class="kpi">

    <div class="kpi-label">
      ACTIVE PATIENTS
    </div>

    <div class="kpi-value">
      ${dashboardActive}
    </div>

    <div class="kpi-sub">
      Currently in program
    </div>

  </div>


  <!-- DUE FOLLOW-UP -->

  <div class="kpi">

    <div class="kpi-label">
      DUE FOLLOW-UP
    </div>

    <div class="kpi-value">
      ${dashboardAlerts.length}
    </div>

    <div class="kpi-sub">
      5+ days since last visit
    </div>

  </div>


  <!-- GOALS COMPLETED -->

  <div class="kpi">

    <div class="kpi-label">
      GOALS COMPLETED
    </div>

    <div class="kpi-value">
      ${dashboardCompleted}
    </div>

    <div class="kpi-sub">
      ${dashboardInactive} inactive patients
    </div>

  </div>

`;


/* =========================================================
   TODAY'S / RECENT PATIENT ACTIVITY
========================================================= */

document.getElementById(
  "todayList"
).innerHTML =

  dashboardPatients.length

    ? dashboardPatients
        .slice(0, 8)
        .map(patient => {

          const visit =
            latestVisit(patient);

          return `

            <div class="row">


              <div class="avatar-small">
                ${patient.initials}
              </div>


              <div class="row-main">

                <div class="row-title">
                  ${patient.name}
                </div>


                <div class="row-sub">

                  ${
                    visit?.type ||
                    "No visit recorded"
                  }

                  ·

                  ${
                    visit?.dateKey ||
                    "—"
                  }

                </div>

              </div>


              <a
                class="secondary"
                style="
                  padding:7px 9px
                "
                href="
                  patient-profile.html?patient=${encodeURIComponent(
                    patient.id
                  )}
                "
              >
                View
              </a>


            </div>

          `;

        })
        .join("")

    : `

      <div class="notif-empty">
        No patient records yet.
      </div>

    `;


/* =========================================================
   PATIENTS NEEDING ATTENTION
========================================================= */

document.getElementById(
  "attentionList"
).innerHTML =

  dashboardAlerts.length

    ? dashboardAlerts
        .slice(0, 8)
        .map(item => {

          return `

            <div
              class="row"
              onclick="
                location.href=
                'patient-profile.html?patient=${encodeURIComponent(
                  item.id
                )}'
              "
              style="cursor:pointer"
            >


              <span
                class="
                  notif-dot
                  ${item.level}
                "
              ></span>


              <div class="row-main">

                <div class="row-title">
                  ${item.name}
                </div>


                <div class="row-sub">

                  ${
                    item.level === "overdue"
                      ? "Overdue"
                      : "Due for Follow-Up"
                  }

                  ·

                  ${item.days}

                  day${
                    item.days === 1
                      ? ""
                      : "s"
                  }

                </div>

              </div>


              <span>
                →
              </span>


            </div>

          `;

        })
        .join("")

    : `

      <div class="notif-empty">
        No patients need attention.
      </div>

    `;


/* =========================================================
   FOLLOW-UP SUMMARY
========================================================= */

document.getElementById(
  "followUpSummary"
).innerHTML =

  dashboardAlerts.length

    ? dashboardAlerts
        .map(item => {

          const colorClass =
            item.level === "overdue"
              ? "red"
              : "orange";


          return `

            <div class="row">


              <span
                class="
                  badge
                  ${colorClass}
                "
              >

                ${
                  item.level === "overdue"
                    ? "OVERDUE"
                    : "DUE"
                }

              </span>


              <div class="row-main">

                <div class="row-title">
                  ${item.name}
                </div>


                <div class="row-sub">

                  Latest recorded visit:

                  ${
                    item.days
                  }

                  days ago

                </div>

              </div>


              <a
                class="secondary"
                style="
                  padding:7px 9px
                "
                href="
                  patient-profile.html?patient=${encodeURIComponent(
                    item.id
                  )}
                "
              >
                Open Patient
              </a>


            </div>

          `;

        })
        .join("")

    : `

      <div class="notif-empty">

        All patients are currently within
        the follow-up window.

      </div>

    `;


/* =========================================================
   REFRESH NOTIFICATION COUNT
========================================================= */

renderNotifications();

</script>

</body>
</html>
