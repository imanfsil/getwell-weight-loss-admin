<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    Dashboard | Getwell Weight Loss Admin
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <script src="app.js"></script>

</head>


<body>


<script>

/* =========================================================
   DASHBOARD
========================================================= */

document.write(

  shell(

    "Dashboard",

    "Weight Loss Program Management",

    "dashboard",

    `

      <div class="page-head">


        <div>

          <h1>
            Good afternoon, Admin
          </h1>


          <p>
            Here's what's happening with the weight loss program today.
          </p>

        </div>


      </div>



      <!-- =================================================
           KPI
      ================================================== -->

      <div
        class="kpi-grid"
        id="dashKpis"
      ></div>



      <!-- =================================================
           DASHBOARD TWO-COLUMN AREA
      ================================================== -->

      <div class="grid-2">



        <!-- TODAY'S / RECENT PATIENT ACTIVITY -->

        <div class="card">


          <div class="card-head">


            <div>

              <h2>
                Today's Appointments
              </h2>


              <p>
                Upcoming and recent patient activity.
              </p>

            </div>


          </div>


          <div
            id="todayList"
            class="list"
          ></div>


        </div>



        <!-- FOLLOW-UP -->

        <div class="card">


          <div class="card-head">


            <div>

              <h2>
                Patients Needing Attention
              </h2>


              <p>
                Based on the latest recorded visit.
              </p>

            </div>


          </div>


          <div
            id="attentionList"
            class="list"
          ></div>


        </div>


      </div>



      <!-- =================================================
           FOLLOW-UP SUMMARY
      ================================================== -->

      <div
        class="card"
        style="
          margin-top:16px;
        "
      >


        <div class="card-head">


          <div>

            <h2>
              Follow-Up Summary
            </h2>


            <p>
              5 days = due for follow-up · 7 days = overdue.
            </p>

          </div>


        </div>


        <div
          id="followUpSummary"
          class="list"
        ></div>


      </div>



      <!-- =================================================
           PANEL SUMMARY
      ================================================== -->

      <div
        class="card"
        style="
          margin-top:16px;
        "
      >


        <div class="card-head">


          <div>

            <h2>
              Panel Claim Overview
            </h2>


            <p>
              Quick view of the current panel claim workload.
            </p>

          </div>


          <a
            href="panel.html"
            class="secondary"
            style="
              padding:
                8px
                11px;
            "
          >
            Open Panel →
          </a>


        </div>


        <div
          id="panelSummary"
          style="
            padding:
              18px;
          "
        ></div>


      </div>

    `

  )

);



/* =========================================================
   GET DATA
========================================================= */

const dashboardData =
  store();


const dashboardPatients =
  dashboardData.patients ||
  [];



/* =========================================================
   BASIC COUNTS
========================================================= */

const totalPatients =
  dashboardPatients.length;


const activePatients =
  dashboardPatients.filter(
    patient =>
      patient.status ===
      "Active"
  ).length;


const completedPatients =
  dashboardPatients.filter(
    patient =>
      patient.status ===
      "Completed"
  ).length;


const inactivePatients =
  dashboardPatients.filter(
    patient =>
      patient.status ===
      "Inactive"
  ).length;


const followUpAlerts =
  alerts();



/* =========================================================
   KPI CARDS
========================================================= */

document.getElementById(
  "dashKpis"
).innerHTML = `


  <!-- TOTAL PATIENTS -->

  <div class="kpi">


    <div class="kpi-label">
      TOTAL PATIENTS
    </div>


    <div class="kpi-value">
      ${totalPatients}
    </div>


    <div class="kpi-sub">
      All registered patients
    </div>


  </div>



  <!-- ACTIVE -->

  <div class="kpi">


    <div class="kpi-label">
      ACTIVE PATIENTS
    </div>


    <div class="kpi-value">
      ${activePatients}
    </div>


    <div class="kpi-sub">
      Currently in program
    </div>


  </div>



  <!-- FOLLOW-UP -->

  <div class="kpi">


    <div class="kpi-label">
      DUE FOLLOW-UP
    </div>


    <div class="kpi-value">
      ${followUpAlerts.length}
    </div>


    <div class="kpi-sub">
      5+ days since latest visit
    </div>


  </div>



  <!-- COMPLETED -->

  <div class="kpi">


    <div class="kpi-label">
      GOALS COMPLETED
    </div>


    <div class="kpi-value">
      ${completedPatients}
    </div>


    <div class="kpi-sub">
      ${inactivePatients}
      inactive patients
    </div>


  </div>


`;



/* =========================================================
   RECENT PATIENT ACTIVITY
========================================================= */

const todayList =
  document.getElementById(
    "todayList"
  );


todayList.innerHTML =

  dashboardPatients.length

    ? dashboardPatients
        .slice(
          0,
          8
        )
        .map(
          patient => {


            const visit =
              latestVisit(
                patient
              );


            return `

              <div
                class="row"
              >


                <div
                  class="avatar-small"
                >
                  ${patient.initials}
                </div>


                <div
                  class="row-main"
                >


                  <div
                    class="row-title"
                  >
                    ${patient.name}
                  </div>


                  <div
                    class="row-sub"
                  >

                    ${
                      visit?.type ||
                      "No visit recorded"
                    }

                    ·

                    ${
                      visit?.dateKey ||
                      "—"
                    }

                  </div>


                </div>


                <a
                  href="
                    patient-profile.html?patient=${encodeURIComponent(
                      patient.id
                    )}
                  "
                  class="secondary"
                  style="
                    padding:
                      7px
                      9px;
                  "
                >
                  View
                </a>


              </div>

            `;

          }
        )
        .join("")


    : `

      <div
        class="notif-empty"
      >

        No patient activity yet.

      </div>

    `;



/* =========================================================
   PATIENTS NEEDING ATTENTION
========================================================= */

const attentionList =
  document.getElementById(
    "attentionList"
  );


attentionList.innerHTML =

  followUpAlerts.length

    ? followUpAlerts
        .slice(
          0,
          8
        )
        .map(
          item => `

            <div
              class="row"
              style="
                cursor:pointer;
              "
              onclick="
                location.href=
                'patient-profile.html?patient=${encodeURIComponent(
                  item.id
                )}'
              "
            >


              <span
                class="
                  notif-dot
                  ${item.level}
                "
              ></span>


              <div
                class="row-main"
              >


                <div
                  class="row-title"
                >
                  ${item.name}
                </div>


                <div
                  class="row-sub"
                >

                  ${
                    item.level ===
                    "overdue"

                      ? "Overdue"

                      : "Due for Follow-Up"

                  }

                  ·

                  ${
                    item.days
                  }

                  day${
                    item.days === 1
                      ? ""
                      : "s"
                  }

                </div>


              </div>


              <span>
                →
              </span>


            </div>

          `
        )
        .join("")


    : `

      <div
        class="notif-empty"
      >

        No patients need attention.

      </div>

    `;



/* =========================================================
   FOLLOW-UP SUMMARY
========================================================= */

const followUpSummary =
  document.getElementById(
    "followUpSummary"
  );


followUpSummary.innerHTML =

  followUpAlerts.length

    ? followUpAlerts
        .map(
          item => `

            <div
              class="row"
            >


              <span
                class="
                  badge
                  ${
                    item.level ===
                    "overdue"
                      ? "red"
                      : "orange"
                  }
                "
              >

                ${
                  item.level ===
                  "overdue"
                    ? "OVERDUE"
                    : "DUE"
                }

              </span>


              <div
                class="row-main"
              >


                <div
                  class="row-title"
                >
                  ${item.name}
                </div>


                <div
                  class="row-sub"
                >

                  Latest recorded visit:

                  ${
                    item.days
                  }

                  days ago

                </div>


              </div>


              <a
                href="
                  patient-profile.html?patient=${encodeURIComponent(
                    item.id
                  )}
                "
                class="secondary"
                style="
                  padding:
                    7px
                    9px;
                "
              >
                Open Patient
              </a>


            </div>

          `
        )
        .join("")


    : `

      <div
        class="notif-empty"
      >

        All patients are currently
        within the follow-up window.

      </div>

    `;



/* =========================================================
   PANEL OVERVIEW
========================================================= */

const panelPatients =
  dashboardPatients.filter(
    patient =>
      patientUsesPanel(
        patient
      )
  );


let panelGrandTotal = 0;

let panelClaimed = 0;



panelPatients.forEach(
  patient => {

    const data =
      finance(
        patient
      );


    panelGrandTotal +=
      data.grand;


    panelClaimed +=
      data.claimed;

  }
);


const panelBalance =
  Math.max(
    0,
    panelGrandTotal -
    panelClaimed
  );



document.getElementById(
  "panelSummary"
).innerHTML = `


  <div
    class="finance-grid"
  >


    <div
      class="finance-card"
    >

      <div
        class="label"
      >
        PANEL PATIENTS
      </div>


      <div
        class="value"
      >
        ${panelPatients.length}
      </div>


    </div>



    <div
      class="finance-card"
    >

      <div
        class="label"
      >
        GRAND TOTAL
      </div>


      <div
        class="value"
      >
        ${money(
          panelGrandTotal
        )}
      </div>


    </div>



    <div
      class="finance-card"
    >

      <div
        class="label"
      >
        TOTAL CLAIMED
      </div>


      <div
        class="value"
      >
        ${money(
          panelClaimed
        )}
      </div>


    </div>



    <div
      class="
        finance-card
        balance
      "
      style="
        grid-column:
          span 1;
      "
    >

      <div
        class="label"
      >
        BALANCE TO CLAIM
      </div>


      <div
        class="value"
      >
        ${money(
          panelBalance
        )}
      </div>


    </div>


  </div>

`;



/* =========================================================
   REFRESH NOTIFICATION
========================================================= */

renderNotifications();

</script>


</body>
</html>
