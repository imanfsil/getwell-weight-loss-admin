<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patients | Getwell</title><link rel="stylesheet" href="styles.css?v=20260824-sync1"><script src="app.js?v=20260824-sync1"></script><style>
#addPatientModal.modal-wrap{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:rgba(17,24,39,.48);pointer-events:none;}
#addPatientModal.modal-wrap.show{display:flex!important;pointer-events:auto!important;}
#addPatientModal .modal{pointer-events:auto;}
</style></head><body><div id="root"></div>
<div class="modal-wrap" id="addPatientModal"><div class="modal"><div class="modal-head"><div><h2>Add Patient</h2><p>Create a new patient record.</p></div><button id="closeAddTop" class="modal-close" type="button">×</button></div><div class="modal-body"><div class="form-grid">
<div class="form-group"><label>Full Name</label><input id="pName"></div>
<div class="form-group"><label>Patient ID</label><input id="pId" readonly placeholder="Auto-generated"></div>
<div class="form-group"><label>Phone</label><input id="pPhone"></div>
<div class="form-group"><label>Date of Birth</label><input id="pDob" type="date"></div>
<div class="form-group"><label>Gender</label><select id="pGender"><option value="">Select</option><option>Male</option><option>Female</option></select></div>
<div class="form-group"><label>Height (cm)</label><input id="pHeight" type="number"></div>
<div class="form-group"><label>Starting Weight (kg)</label><input id="pStart" type="number"></div>
<div class="form-group"><label>Goal Weight (kg)</label><input id="pGoal" type="number"></div>
<div class="form-group"><label>Program Start Date</label><input id="pStartDate" type="date"></div>
<div class="form-group"><label>Panel / Payment</label><select id="pPanel"></select></div>
<div class="form-group"><label>Doctor</label><select id="pDoctor"><option value="">Select doctor</option></select></div>
</div></div><div class="modal-foot"><button id="closeAddButton" class="secondary" type="button">Cancel</button><button id="savePatientButton" class="primary" type="button">Save Patient</button></div></div></div>
<script>
function renderPatientFormOptions(){
  const panelSelect = document.getElementById("pPanel");
  if(panelSelect){
    panelSelect.innerHTML = getwellPanelOptions()
      .map(panel => `<option value="${escapeHtml(panel.id)}">${escapeHtml(panel.name)}</option>`)
      .join("");
    panelSelect.value = "SELF_PAY";
  }
  const doctorSelect = document.getElementById("pDoctor");
  if(doctorSelect){
    doctorSelect.innerHTML =
      `<option value="">Select doctor</option>` +
      getwellDoctorOptions()
        .map(doctor => `<option value="${escapeHtml(doctor.name)}">${escapeHtml(doctor.name)}</option>`)
        .join("");
  }
}

/*
  Patient IDs now come from Settings -> Patient Management
  (prefix, digit width and next number) instead of being
  hardcoded to GW-0000. getwellAllocatePatientId() also skips
  any number already present in the store so an ID is never
  handed out twice.
*/
function generatePatientId(){
  return getwellAllocatePatientId().id;
}

function styleGeneratedPatientId(){
  const el=document.getElementById("pId");
  if(!el) return;
  el.style.background="#f8fafc";
  el.style.fontWeight="600";
  el.title="Patient ID is generated automatically";
}

function openAdd(){
  renderPatientFormOptions();
  document.getElementById("addPatientModal").classList.add("show");
  document.getElementById("pId").value=generatePatientId();
  styleGeneratedPatientId();
  document.getElementById("pStartDate").value=new Date().toISOString().slice(0,10);
}

function closeAdd(){
  document.getElementById("addPatientModal").classList.remove("show");
}

function savePatient(){
  const pNameEl=document.getElementById("pName");
  const pPhoneEl=document.getElementById("pPhone");
  const pDobEl=document.getElementById("pDob");
  const pGenderEl=document.getElementById("pGender");
  const pHeightEl=document.getElementById("pHeight");
  const pStartEl=document.getElementById("pStart");
  const pGoalEl=document.getElementById("pGoal");
  const pStartDateEl=document.getElementById("pStartDate");
  const pPanelEl=document.getElementById("pPanel");
  const pDoctorEl=document.getElementById("pDoctor");

  const name=String(pNameEl?.value||"").trim();
  if(!name){alert("Please enter the patient name.");return}

  const allocation=getwellAllocatePatientId();
  const id=allocation.id;
  const sw=Number(pStartEl?.value||0)||0;
  const pv=normalizePanelType(pPanelEl?.value||"SELF_PAY");
  const nm=name.split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();

  const p={
    id,name,initials:nm,status:getwellDefaultPatientStatus(),
    panelProvider:pv,otherPanelName:"",
    panelStatus:"Active",panelSuspensionNote:"",
    phone:pPhoneEl?.value||"",dob:pDobEl?.value||"",gender:pGenderEl?.value||"",
    height:pHeightEl?.value||"",startingWeight:sw,currentWeight:sw,
    goalWeight:Number(pGoalEl?.value||0)||0,
    startDate:pStartDateEl?.value||new Date().toISOString().slice(0,10),
    doctor:pDoctorEl?.value||"",
    visits:[],claims:[],appointments:[],measurements:[]
  };

  upsertPatient(p);
  getwellAdvancePatientNumber(allocation.number);
  getwellNotify("Patient saved successfully.","success");
  closeAdd();
  location.href="patient-profile.html?patient="+encodeURIComponent(p.id);
}

function renderPatients(q=""){
  const all = (typeof store === "function" ? (store().patients || []) : []);
  const search = String(q || "").toLowerCase();
  const ps = all.filter(p => (`${p.name||""} ${p.id||""} ${p.phone||""}`).toLowerCase().includes(search));
  const rows = document.getElementById("patientRows");
  const kpis = document.getElementById("patientKpis");
  if(!rows || !kpis) return;
  rows.innerHTML = ps.map(p => {
    const v = typeof latestVisit === "function" ? latestVisit(p) : null;
    const panelName = typeof getPanelName === "function" ? getPanelName(p) : (p.panelProvider || "Self-Pay");
    return `<tr><td><strong>${escapeHtml(p.name||"")}</strong><div class="row-sub">${escapeHtml(p.phone||"—")}</div></td><td>${escapeHtml(p.id||"")}</td><td><span class="panel-chip">${escapeHtml(panelName)}</span></td><td>${escapeHtml(p.currentWeight||"—")} kg</td><td>${escapeHtml(p.goalWeight||"—")} kg</td><td>${escapeHtml(v?.dateKey||"—")}</td><td><span class="badge ${p.status==="Active"?"green":"gray"}">${escapeHtml(p.status||"")}</span></td><td><a class="secondary" style="padding:7px 9px" href="patient-profile.html?patient=${encodeURIComponent(p.id||"")}">Open →</a></td></tr>`;
  }).join("") || `<tr><td colspan="8" class="notif-empty">No patients found.</td></tr>`;
  const panelCount = typeof patientUsesPanel === "function" ? all.filter(patientUsesPanel).length : 0;
  kpis.innerHTML = `<div class="kpi"><div class="kpi-label">TOTAL PATIENTS</div><div class="kpi-value">${all.length}</div></div><div class="kpi"><div class="kpi-label">ACTIVE PATIENTS</div><div class="kpi-value">${all.filter(p=>p.status==="Active").length}</div></div><div class="kpi"><div class="kpi-label">PANEL PATIENTS</div><div class="kpi-value">${panelCount}</div></div><div class="kpi"><div class="kpi-label">INACTIVE</div><div class="kpi-value">${all.filter(p=>p.status==="Inactive").length}</div></div>`;
}

document.getElementById("root").innerHTML=shell("Patients","patients",`<div class="page-head"><div><h1>Patients</h1><p>Manage patient records.</p></div><button id="addPatientButton" class="primary" type="button">＋ Add Patient</button></div><div class="kpi-grid" id="patientKpis"></div><div class="card" style="margin-bottom:15px"><div class="card-body"><div class="form-group"><label>Search Patient</label><input class="claim-input" oninput="renderPatients(this.value)" placeholder="Search name, ID or phone"></div></div></div><div class="card"><div class="card-head"><div><h2>Patient List</h2><p>All patients use GW-XXXX IDs.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Patient</th><th>ID</th><th>Panel / Payment</th><th>Current</th><th>Goal</th><th>Last Visit</th><th>Status</th><th></th></tr></thead><tbody id="patientRows"></tbody></table></div></div>`);

window.openAdd = openAdd;
window.closeAdd = closeAdd;
window.savePatient = savePatient;

const addPatientButton = document.getElementById("addPatientButton");
const closeAddTop = document.getElementById("closeAddTop");
const closeAddButton = document.getElementById("closeAddButton");
const savePatientButton = document.getElementById("savePatientButton");
if(addPatientButton) addPatientButton.addEventListener("click", openAdd);
if(closeAddTop) closeAddTop.addEventListener("click", closeAdd);
if(closeAddButton) closeAddButton.addEventListener("click", closeAdd);
if(savePatientButton) savePatientButton.addEventListener("click", savePatient);

renderPatients();
if(typeof renderNotifications === "function") renderNotifications();
</script></body></html>
