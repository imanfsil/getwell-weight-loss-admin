<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    Patients | Getwell Weight Loss Admin
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <script src="app.js"></script>

</head>


<body>


<div id="root"></div>


<!-- =========================================================
     ADD PATIENT MODAL
========================================================= -->

<div
  class="modal-wrap"
  id="addPatientModal"
>

  <div class="modal">


    <div class="modal-head">

      <div>

        <h2>
          Add Patient
        </h2>

        <p>
          Create one patient record.
        </p>

      </div>


      <button
        type="button"
        class="modal-close"
        onclick="closeAdd()"
      >
        ×
      </button>

    </div>


    <div class="modal-body">


      <div class="form-grid">


        <!-- FULL NAME -->

        <div class="form-group">

          <label>
            Full Name
          </label>

          <input
            id="pName"
            placeholder="Enter patient name"
          >

        </div>


        <!-- PATIENT ID -->

        <div class="form-group">

          <label>
            Patient ID
          </label>

          <input
            id="pId"
            placeholder="e.g. GW0001"
          >

        </div>


        <!-- PHONE -->

        <div class="form-group">

          <label>
            Phone
          </label>

          <input
            id="pPhone"
            placeholder="Phone number"
          >

        </div>


        <!-- DOB -->

        <div class="form-group">

          <label>
            Date of Birth
          </label>

          <input
            id="pDob"
            type="date"
          >

        </div>


        <!-- HEIGHT -->

        <div class="form-group">

          <label>
            Height (cm)
          </label>

          <input
            id="pHeight"
            type="number"
            min="0"
            step="0.1"
            placeholder="e.g. 165"
          >

        </div>


        <!-- STARTING WEIGHT -->

        <div class="form-group">

          <label>
            Starting Weight (kg)
          </label>

          <input
            id="pStart"
            type="number"
            min="0"
            step="0.1"
            placeholder="e.g. 78"
          >

        </div>


        <!-- GOAL WEIGHT -->

        <div class="form-group">

          <label>
            Goal Weight (kg)
          </label>

          <input
            id="pGoal"
            type="number"
            min="0"
            step="0.1"
            placeholder="e.g. 65"
          >

        </div>


        <!-- PANEL / SELF PAY -->

        <div class="form-group">

          <label>
            Panel / Insurance
          </label>

          <select
            id="pPanel"
          >

            <option value="SELF_PAY">
              Self-Pay
            </option>

            <option value="PANEL_A">
              Panel A
            </option>

            <option value="PANEL_B">
              Panel B
            </option>

            <option value="PANEL_C">
              Panel C
            </option>

            <option value="Other">
              Other Panel
            </option>

          </select>

        </div>


      </div>


    </div>


    <div class="modal-foot">

      <button
        type="button"
        class="secondary"
        onclick="closeAdd()"
      >
        Cancel
      </button>


      <button
        type="button"
        class="primary"
        onclick="savePatient()"
      >
        Save Patient
      </button>

    </div>


  </div>

</div>



<script>


/* =========================================================
   PAGE SETUP
========================================================= */

document.getElementById(
  "root"
).innerHTML =

  shell(

    "Patients",

    "Weight Loss Program Management",

    "patients",

    `

      <div class="page-head">


        <div>

          <h1>
            Patients
          </h1>

          <p>
            Manage patient records and monitor program participation.
          </p>

        </div>


        <button
          type="button"
          class="primary"
          onclick="openAdd()"
        >
          ＋ Add Patient
        </button>


      </div>



      <!-- ===================================================
           KPI
      ==================================================== -->

      <div
        class="kpi-grid"
        id="patientKpis"
      ></div>



      <!-- ===================================================
           PATIENT TABLE
      ==================================================== -->

      <div class="card">


        <div class="card-head">


          <div>

            <h2>
              Patient List
            </h2>

            <p>
              One shared patient data source for the whole web.
            </p>

          </div>


          <input
            class="claim-input"
            id="patientSearch"
            placeholder="Search patient name or ID"
            oninput="renderPatients(this.value)"
          >


        </div>


        <div class="table-wrap">


          <table class="table">


            <thead>

              <tr>

                <th>
                  Patient
                </th>

                <th>
                  ID
                </th>

                <th>
                  Panel / Payment
                </th>

                <th>
                  Current
                </th>

                <th>
                  Goal
                </th>

                <th>
                  Last Visit
                </th>

                <th>
                  Status
                </th>

                <th>
                </th>

              </tr>

            </thead>


            <tbody
              id="patientRows"
            ></tbody>


          </table>


        </div>


      </div>

    `

);



/* =========================================================
   ADD PATIENT MODAL
========================================================= */

function openAdd(){

  const modal =
    document.getElementById(
      "addPatientModal"
    );

  modal.classList.add("show");

}


function closeAdd(){

  const modal =
    document.getElementById(
      "addPatientModal"
    );

  modal.classList.remove("show");

}



/* =========================================================
   RENDER PATIENT LIST
========================================================= */

function renderPatients(
  search = ""
){

  const query =
    search
      .trim()
      .toLowerCase();


  const patients =
    store()
      .patients
      .filter(
        patient => {

          const text =
            (
              patient.name +
              " " +
              patient.id
            )
              .toLowerCase();


          return text.includes(
            query
          );

        }
      );



  document.getElementById(
    "patientRows"
  ).innerHTML =


    patients.length


      ? patients
          .map(
            patient => {

              const visit =
                latestVisit(
                  patient
                );


              return `

                <tr>


                  <!-- PATIENT -->

                  <td>

                    <strong>
                      ${patient.name}
                    </strong>

                    <div
                      style="
                        font-size:9px;
                        color:#94A3B8;
                        margin-top:3px;
                      "
                    >
                      ${patient.id}
                    </div>

                  </td>


                  <!-- ID -->

                  <td>
                    ${patient.id}
                  </td>


                  <!-- PANEL -->

                  <td>

                    <span
                      class="panel-chip"
                    >
                      ${getPanelName(
                        patient
                      )}
                    </span>

                  </td>


                  <!-- CURRENT WEIGHT -->

                  <td>

                    ${
                      patient.currentWeight !==
                      undefined
                        ? `${patient.currentWeight} kg`
                        : "—"
                    }

                  </td>


                  <!-- GOAL -->

                  <td>

                    ${
                      patient.goalWeight
                        ? `${patient.goalWeight} kg`
                        : "—"
                    }

                  </td>


                  <!-- LAST VISIT -->

                  <td>

                    ${
                      visit?.dateKey ||
                      "—"
                    }

                  </td>


                  <!-- STATUS -->

                  <td>

                    <span
                      class="
                        badge
                        ${
                          patient.status ===
                          "Active"
                            ? "green"
                            : patient.status ===
                              "Completed"
                              ? "blue"
                              : "gray"
                        }
                      "
                    >
                      ${patient.status}
                    </span>

                  </td>


                  <!-- OPEN -->

                  <td>

                    <a
                      class="secondary"
                      style="
                        padding:7px 9px;
                      "
                      href="
                        patient-profile.html?patient=${encodeURIComponent(
                          patient.id
                        )}
                      "
                    >
                      Open →
                    </a>

                  </td>


                </tr>

              `;

            }
          )
          .join("")


      : `

          <tr>

            <td
              colspan="8"
              style="
                text-align:center;
                padding:28px;
                color:var(--muted);
              "
            >

              No patients found.

            </td>

          </tr>

        `;



  /* =======================================================
     KPI
  ======================================================== */

  const all =
    store().patients;


  const active =
    all.filter(
      patient =>
        patient.status ===
        "Active"
    ).length;


  const completed =
    all.filter(
      patient =>
        patient.status ===
        "Completed"
    ).length;


  const inactive =
    all.filter(
      patient =>
        patient.status ===
        "Inactive"
    ).length;



  document.getElementById(
    "patientKpis"
  ).innerHTML = `


    <div class="kpi">

      <div class="kpi-label">
        TOTAL PATIENTS
      </div>

      <div class="kpi-value">
        ${all.length}
      </div>

      <div class="kpi-sub">
        All registered patients
      </div>

    </div>


    <div class="kpi">

      <div class="kpi-label">
        ACTIVE PATIENTS
      </div>

      <div class="kpi-value">
        ${active}
      </div>

      <div class="kpi-sub">
        Currently in program
      </div>

    </div>


    <div class="kpi">

      <div class="kpi-label">
        COMPLETED
      </div>

      <div class="kpi-value">
        ${completed}
      </div>

      <div class="kpi-sub">
        Program completed
      </div>

    </div>


    <div class="kpi">

      <div class="kpi-label">
        INACTIVE
      </div>

      <div class="kpi-value">
        ${inactive}
      </div>

      <div class="kpi-sub">
        Currently inactive
      </div>

    </div>

  `;

}



/* =========================================================
   SAVE PATIENT
========================================================= */

function savePatient(){


  const name =
    document.getElementById(
      "pName"
    ).value.trim();


  const patientId =
    document.getElementById(
      "pId"
    ).value.trim();


  const phone =
    document.getElementById(
      "pPhone"
    ).value.trim();


  const dob =
    document.getElementById(
      "pDob"
    ).value;


  const height =
    document.getElementById(
      "pHeight"
    ).value;


  const startingWeight =
    Number(
      document.getElementById(
        "pStart"
      ).value
    ) || 0;


  const goalWeight =
    Number(
      document.getElementById(
        "pGoal"
      ).value
    ) || 0;


  const panelProvider =
    document.getElementById(
      "pPanel"
    ).value;



  /* =======================================================
     VALIDATION
  ======================================================== */

  if(!name){

    alert(
      "Please enter the patient name."
    );

    return;
  }


  if(!patientId){

    alert(
      "Please enter the patient ID."
    );

    return;
  }



  /* Prevent duplicate Patient ID */

  const exists =
    store()
      .patients
      .some(
        patient =>
          patient.id.toLowerCase() ===
          patientId.toLowerCase()
      );


  if(exists){

    alert(
      "This Patient ID already exists."
    );

    return;
  }



  /* =======================================================
     CREATE PATIENT OBJECT
  ======================================================== */

  const initials =
    name
      .split(/\s+/)
      .filter(Boolean)
      .map(
        part =>
          part.charAt(0)
      )
      .join("")
      .slice(0,2)
      .toUpperCase();


  const today =
    new Date()
      .toISOString()
      .slice(0,10);


  const patient = {

    id:patientId,

    name:name,

    initials:
      initials || "PT",

    status:"Active",

    panelProvider:
      panelProvider,

    otherPanelName:"",

    startDate:
      today,

    doctor:"",

    phone:phone,

    dob:dob,

    height:height,

    gender:"",

    startingWeight:
      startingWeight,

    currentWeight:
      startingWeight,

    goalWeight:
      goalWeight,

    visits:[],

    measurements:[],

    appointments:[]

  };



  /* =======================================================
     SAVE TO SHARED STORE
  ======================================================== */

  upsertPatient(
    patient
  );


  /* Close modal */

  closeAdd();


  /* Clear fields */

  document.getElementById(
    "pName"
  ).value = "";

  document.getElementById(
    "pId"
  ).value = "";

  document.getElementById(
    "pPhone"
  ).value = "";

  document.getElementById(
    "pDob"
  ).value = "";

  document.getElementById(
    "pHeight"
  ).value = "";

  document.getElementById(
    "pStart"
  ).value = "";

  document.getElementById(
    "pGoal"
  ).value = "";

  document.getElementById(
    "pPanel"
  ).value = "SELF_PAY";


  /* Refresh */

  renderPatients();

  renderNotifications();


  /* Go directly to patient profile */

  setTimeout(
    () => {

      window.location.href =
        "patient-profile.html?patient=" +
        encodeURIComponent(
          patient.id
        );

    },
    250
  );

}



/* =========================================================
   INITIAL RENDER
========================================================= */

renderPatients();


renderNotifications();


</script>


</body>
</html>
