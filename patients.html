<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patients | Getwell</title><link rel="stylesheet" href="styles.css?v=20260822fix"><script src="app.js?v=20260822fix"></script></head><body><div id="root"></div>
<div class="modal-wrap" id="addPatientModal"><div class="modal"><div class="modal-head"><div><h2>Add Patient</h2><p>Create a new patient record.</p></div><button class="modal-close" onclick="closeAdd()">×</button></div><div class="modal-body"><div class="form-grid">
<div class="form-group"><label>Full Name</label><input id="pName"></div>
<div class="form-group"><label>Patient ID</label><input id="pId" readonly placeholder="Auto-generated"></div>
<div class="form-group"><label>Phone</label><input id="pPhone"></div>
<div class="form-group"><label>Date of Birth</label><input id="pDob" type="date"></div>
<div class="form-group"><label>Gender</label><select id="pGender"><option value="">Select</option><option>Male</option><option>Female</option></select></div>
<div class="form-group"><label>Height (cm)</label><input id="pHeight" type="number"></div>
<div class="form-group"><label>Starting Weight (kg)</label><input id="pStart" type="number"></div>
<div class="form-group"><label>Goal Weight (kg)</label><input id="pGoal" type="number"></div>
<div class="form-group"><label>Program Start Date</label><input id="pStartDate" type="date"></div>
<div class="form-group"><label>Panel / Payment</label><select id="pPanel">

            <option value="PMCARE">PMCARE</option>
            <option value="UITM">UITM</option>
            <option value="COMPUMED">COMPUMED</option>
            <option value="MICARE">MICARE</option>
            <option value="SELCARE">SELCARE</option>
            <option value="IHP">IHP</option>
            <option value="ASP">ASP</option>
            <option value="HEALTHCONNECT">HEALTHCONNECT</option>
            <option value="EMAS">EMAS</option>
            <option value="SELFPAY">SELFPAY</option>
            <option value="SPONSORED">SPONSORED</option>

          </select></div>

<div class="form-group"><label>Doctor</label><input id="pDoctor"></div>
</div></div><div class="modal-foot"><button class="secondary" onclick="closeAdd()">Cancel</button><button class="primary" onclick="savePatient()">Save Patient</button></div></div></div>
<script>
function generatePatientId(){const ps=store().patients||[];let n=0;ps.forEach(p=>{const m=String(p.id||"").match(/^GW-(\d+)$/i);if(m)n=Math.max(n,+m[1])});return "GW-"+String(n+1).padStart(4,"0")}
function openAdd(){document.getElementById("addPatientModal").classList.add("show");document.getElementById("pId").value=generatePatientId();styleGeneratedPatientId();styleGeneratedPatientId();document.getElementById("pStartDate").value=new Date().toISOString().slice(0,10)}
function closeAdd(){document.getElementById("addPatientModal").classList.remove("show")}
document.getElementById("pPanel").addEventListener("change",e=>document.getElementById("otherPanelGroup").style.display=e.target.value==="Other"?"block":"none");
function savePatient(){const name=pName.value.trim();if(!name){alert("Please enter the patient name.");return}const id=generatePatientId();const sw=+pStart.value||0;const pv=normalizePanelType(pPanel.value);const nm=name.split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();const p={id,name,initials:nm,status:"Active",panelProvider:pv,otherPanelName:pv==="Other"?pOtherPanel.value.trim():"",panelStatus:patientUsesPanel({panelProvider:pv})?"Active":"Active",panelSuspensionNote:"",phone:pPhone.value,dob:pDob.value,gender:pGender.value,height:pHeight.value,startingWeight:sw,currentWeight:sw,goalWeight:+pGoal.value||0,startDate:pStartDate.value||new Date().toISOString().slice(0,10),doctor:pDoctor.value,visits:[],claims:[],appointments:[],measurements:[]};upsertPatient(p);closeAdd();location.href="patient-profile.html?patient="+encodeURIComponent(p.id)}
function renderPatients(q=""){const all=store().patients;const ps=all.filter(p=>(p.name+" "+p.id+" "+(p.phone||"")).toLowerCase().includes(q.toLowerCase()));patientRows.innerHTML=ps.map(p=>{const v=latestVisit(p);return `<tr><td><strong>${p.name}</strong><div class="row-sub">${p.phone||"—"}</div></td><td>${p.id}</td><td><span class="panel-chip">${getPanelName(p)}</span></td><td>${p.currentWeight||"—"} kg</td><td>${p.goalWeight||"—"} kg</td><td>${v?.dateKey||"—"}</td><td><span class="badge ${p.status==="Active"?"green":"gray"}">${p.status}</span></td><td><a class="secondary" style="padding:7px 9px" href="patient-profile.html?patient=${p.id}">Open →</a></td></tr>`}).join("")||`<tr><td colspan="8" class="notif-empty">No patients found.</td></tr>`;patientKpis.innerHTML=`<div class="kpi"><div class="kpi-label">TOTAL PATIENTS</div><div class="kpi-value">${all.length}</div></div><div class="kpi"><div class="kpi-label">ACTIVE PATIENTS</div><div class="kpi-value">${all.filter(p=>p.status==="Active").length}</div></div><div class="kpi"><div class="kpi-label">PANEL PATIENTS</div><div class="kpi-value">${all.filter(patientUsesPanel).length}</div></div><div class="kpi"><div class="kpi-label">INACTIVE</div><div class="kpi-value">${all.filter(p=>p.status==="Inactive").length}</div></div>`}
document.getElementById("root").innerHTML=shell("Patients","patients",`<div class="page-head"><div><h1>Patients</h1><p>Manage patient records.</p></div><button class="primary" onclick="openAdd()">＋ Add Patient</button></div><div class="kpi-grid" id="patientKpis"></div><div class="card" style="margin-bottom:15px"><div class="card-body"><div class="form-group"><label>Search Patient</label><input class="claim-input" oninput="renderPatients(this.value)" placeholder="Search name, ID or phone"></div></div></div><div class="card"><div class="card-head"><div><h2>Patient List</h2><p>All patients use GW-XXXX IDs.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Patient</th><th>ID</th><th>Panel / Payment</th><th>Current</th><th>Goal</th><th>Last Visit</th><th>Status</th><th></th></tr></thead><tbody id="patientRows"></tbody></table></div></div>`);renderPatients();renderNotifications();
</script></body></html>
