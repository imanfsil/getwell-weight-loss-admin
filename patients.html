<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    Patients | Getwell Weight Loss Admin
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <script src="app.js"></script>

</head>


<body>


<div id="root"></div>



<!-- =========================================================
     ADD PATIENT MODAL
========================================================= -->

<div
  class="modal-wrap"
  id="addPatientModal"
>

  <div class="modal">


    <div class="modal-head">


      <div>

        <h2>
          Add Patient
        </h2>


        <p>
          Create a new patient record.
        </p>

      </div>


      <button
        type="button"
        class="modal-close"
        onclick="closeAdd()"
      >
        ×
      </button>


    </div>



    <div class="modal-body">


      <div class="form-grid">


        <!-- FULL NAME -->

        <div class="form-group">

          <label>
            Full Name
          </label>


          <input
            id="pName"
            placeholder="Enter patient name"
          >

        </div>



        <!-- PATIENT ID -->

        <div class="form-group">

          <label>
            Patient ID
          </label>


          <input
            id="pId"
            placeholder="e.g. GW0001"
          >

        </div>



        <!-- PHONE -->

        <div class="form-group">

          <label>
            Phone
          </label>


          <input
            id="pPhone"
            placeholder="Phone number"
          >

        </div>



        <!-- DOB -->

        <div class="form-group">

          <label>
            Date of Birth
          </label>


          <input
            id="pDob"
            type="date"
          >

        </div>



        <!-- GENDER -->

        <div class="form-group">

          <label>
            Gender
          </label>


          <select
            id="pGender"
          >

            <option value="">
              Select
            </option>

            <option value="Male">
              Male
            </option>

            <option value="Female">
              Female
            </option>

          </select>

        </div>



        <!-- HEIGHT -->

        <div class="form-group">

          <label>
            Height (cm)
          </label>


          <input
            id="pHeight"
            type="number"
            min="0"
            step="0.1"
            placeholder="e.g. 165"
          >

        </div>



        <!-- STARTING WEIGHT -->

        <div class="form-group">

          <label>
            Starting Weight (kg)
          </label>


          <input
            id="pStart"
            type="number"
            min="0"
            step="0.1"
            placeholder="e.g. 78"
          >

        </div>



        <!-- GOAL WEIGHT -->

        <div class="form-group">

          <label>
            Goal Weight (kg)
          </label>


          <input
            id="pGoal"
            type="number"
            min="0"
            step="0.1"
            placeholder="e.g. 65"
          >

        </div>



        <!-- PROGRAM START DATE -->

        <div class="form-group">

          <label>
            Program Start Date
          </label>


          <input
            id="pStartDate"
            type="date"
          >

        </div>



        <!-- PANEL -->

        <div class="form-group">

          <label>
            Panel / Payment Type
          </label>


          <select
            id="pPanel"
          >

            <option value="SELF_PAY">
              Self-Pay
            </option>

            <option value="PANEL_A">
              Panel A
            </option>

            <option value="PANEL_B">
              Panel B
            </option>

            <option value="PANEL_C">
              Panel C
            </option>

            <option value="Other">
              Other Panel
            </option>

          </select>

        </div>



        <!-- OTHER PANEL NAME -->

        <div
          class="form-group"
          id="otherPanelGroup"
          style="display:none"
        >

          <label>
            Panel Name
          </label>


          <input
            id="pOtherPanel"
            placeholder="Enter panel name"
          >

        </div>



        <!-- DOCTOR -->

        <div class="form-group">

          <label>
            Doctor
          </label>


          <input
            id="pDoctor"
            placeholder="Doctor name"
          >

        </div>


      </div>


    </div>



    <div class="modal-foot">


      <button
        type="button"
        class="secondary"
        onclick="closeAdd()"
      >
        Cancel
      </button>


      <button
        type="button"
        class="primary"
        onclick="savePatient()"
      >
        Save Patient
      </button>


    </div>


  </div>

</div>



<script>


/* =========================================================
   PAGE
========================================================= */

document.getElementById(
  "root"
).innerHTML =

shell(

  "Patients",

  "Weight Loss Program Management",

  "patients",

  `

    <div class="page-head">


      <div>

        <h1>
          Patients
        </h1>


        <p>
          Manage patient records and program participation.
        </p>

      </div>


      <button
        type="button"
        class="primary"
        onclick="openAdd()"
      >
        ＋ Add Patient
      </button>


    </div>



    <!-- =================================================
         KPI
    ================================================== -->

    <div
      class="kpi-grid"
      id="patientKpis"
    ></div>



    <!-- =================================================
         SEARCH
    ================================================== -->

    <div
      class="card"
      style="
        margin-bottom:15px;
      "
    >


      <div class="card-body">


        <div
          class="form-group"
          style="max-width:500px"
        >

          <label>
            Search Patient
          </label>


          <input
            class="claim-input"
            id="patientSearch"
            placeholder="Search by patient name, ID or phone"
            oninput="
              renderPatients(
                this.value
              )
            "
          >

        </div>


      </div>


    </div>



    <!-- =================================================
         PATIENT TABLE
    ================================================== -->

    <div class="card">


      <div class="card-head">


        <div>

          <h2>
            Patient List
          </h2>


          <p>
            One shared patient data source for the whole system.
          </p>

        </div>


      </div>



      <div class="table-wrap">


        <table class="table">


          <thead>


            <tr>


              <th>
                Patient
              </th>


              <th>
                ID
              </th>


              <th>
                Panel / Payment
              </th>


              <th>
                Current
              </th>


              <th>
                Goal
              </th>


              <th>
                Last Visit
              </th>


              <th>
                Status
              </th>


              <th>
              </th>


            </tr>


          </thead>



          <tbody
            id="patientRows"
          ></tbody>


        </table>


      </div>


    </div>

  `

);



/* =========================================================
   PANEL SELECT
========================================================= */

document.getElementById(
  "pPanel"
).addEventListener(
  "change",
  function(){

    document.getElementById(
      "otherPanelGroup"
    ).style.display =
      this.value === "Other"
        ? "block"
        : "none";

  }
);



/* =========================================================
   OPEN MODAL
========================================================= */

function openAdd(){

  document
    .getElementById(
      "addPatientModal"
    )
    .classList.add(
      "show"
    );


  const startDate =
    document.getElementById(
      "pStartDate"
    );


  if(
    startDate &&
    !startDate.value
  ){

    startDate.value =
      new Date()
        .toISOString()
        .slice(
          0,
          10
        );

  }

}



/* =========================================================
   CLOSE MODAL
========================================================= */

function closeAdd(){

  document
    .getElementById(
      "addPatientModal"
    )
    .classList.remove(
      "show"
    );

}



/* =========================================================
   RENDER PATIENTS
========================================================= */

function renderPatients(
  search = ""
){

  const query =
    search
      .trim()
      .toLowerCase();


  const patients =
    store()
      .patients
      .filter(
        patient => {

          const searchableText =

            (
              patient.name ||
              ""
            )

            +

            " "

            +

            (
              patient.id ||
              ""
            )

            +

            " "

            +

            (
              patient.phone ||
              ""
            )

            +

            " "

            +

            (
              getPanelName(
                patient
              ) || ""
            );


          return searchableText
            .toLowerCase()
            .includes(
              query
            );

        }
      );



  const rows =
    document.getElementById(
      "patientRows"
    );


  rows.innerHTML =

    patients.length

      ? patients
          .map(
            patient => {

              const visit =
                latestVisit(
                  patient
                );


              return `

                <tr>


                  <!-- PATIENT -->

                  <td>

                    <strong>
                      ${patient.name}
                    </strong>


                    <div
                      style="
                        font-size:10px;
                        color:var(--muted);
                        margin-top:3px;
                      "
                    >
                      ${
                        patient.phone ||
                        "No phone"
                      }
                    </div>

                  </td>



                  <!-- ID -->

                  <td>

                    ${patient.id}

                  </td>



                  <!-- PANEL -->

                  <td>

                    <span
                      class="panel-chip"
                    >

                      ${getPanelName(
                        patient
                      )}

                    </span>

                  </td>



                  <!-- CURRENT -->

                  <td>

                    ${
                      patient.currentWeight
                        ? `${patient.currentWeight} kg`
                        : "—"
                    }

                  </td>



                  <!-- GOAL -->

                  <td>

                    ${
                      patient.goalWeight
                        ? `${patient.goalWeight} kg`
                        : "—"
                    }

                  </td>



                  <!-- LAST VISIT -->

                  <td>

                    ${
                      visit?.dateKey ||
                      "—"
                    }

                  </td>



                  <!-- STATUS -->

                  <td>


                    <span
                      class="
                        badge

                        ${
                          patient.status ===
                          "Active"

                            ? "green"

                            :

                          patient.status ===
                          "Completed"

                            ? "blue"

                            : "gray"
                        }
                      "
                    >

                      ${
                        patient.status ||
                        "Active"
                      }

                    </span>


                  </td>



                  <!-- OPEN -->

                  <td>


                    <a
                      class="secondary"
                      style="
                        padding:
                          7px
                          9px;
                      "
                      href="
                        patient-profile.html?patient=${encodeURIComponent(
                          patient.id
                        )}
                      "
                    >

                      Open →

                    </a>


                  </td>


                </tr>

              `;

            }
          )
          .join("")


      : `

        <tr>


          <td
            colspan="8"
            style="
              text-align:center;
              padding:32px;
              color:var(--muted);
            "
          >

            No patients found.

          </td>


        </tr>

      `;



  /* =======================================================
     KPI
  ======================================================== */

  const allPatients =
    store()
      .patients;


  const active =
    allPatients
      .filter(
        patient =>
          patient.status ===
          "Active"
      )
      .length;


  const completed =
    allPatients
      .filter(
        patient =>
          patient.status ===
          "Completed"
      )
      .length;


  const inactive =
    allPatients
      .filter(
        patient =>
          patient.status ===
          "Inactive"
      )
      .length;


  const panel =
    allPatients
      .filter(
        patient =>
          patientUsesPanel(
            patient
          )
      )
      .length;



  document.getElementById(
    "patientKpis"
  ).innerHTML = `


    <!-- TOTAL -->

    <div class="kpi">

      <div class="kpi-label">
        TOTAL PATIENTS
      </div>


      <div class="kpi-value">
        ${allPatients.length}
      </div>


      <div class="kpi-sub">
        All registered patients
      </div>

    </div>



    <!-- ACTIVE -->

    <div class="kpi">

      <div class="kpi-label">
        ACTIVE PATIENTS
      </div>


      <div class="kpi-value">
        ${active}
      </div>


      <div class="kpi-sub">
        Currently in program
      </div>

    </div>



    <!-- PANEL -->

    <div class="kpi">

      <div class="kpi-label">
        PANEL PATIENTS
      </div>


      <div class="kpi-value">
        ${panel}
      </div>


      <div class="kpi-sub">
        Using insurance / panel
      </div>

    </div>



    <!-- INACTIVE -->

    <div class="kpi">

      <div class="kpi-label">
        INACTIVE
      </div>


      <div class="kpi-value">
        ${inactive}
      </div>


      <div class="kpi-sub">
        ${completed}
        completed
      </div>

    </div>


  `;

}



/* =========================================================
   SAVE PATIENT
========================================================= */

function savePatient(){

  const name =
    document
      .getElementById(
        "pName"
      )
      .value
      .trim();


  const patientId =
    document
      .getElementById(
        "pId"
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        "pPhone"
      )
      .value
      .trim();


  const dob =
    document
      .getElementById(
        "pDob"
      )
      .value;


  const gender =
    document
      .getElementById(
        "pGender"
      )
      .value;


  const height =
    document
      .getElementById(
        "pHeight"
      )
      .value;


  const startingWeight =
    Number(
      document
        .getElementById(
          "pStart"
        )
        .value
    ) || 0;


  const goalWeight =
    Number(
      document
        .getElementById(
          "pGoal"
        )
        .value
    ) || 0;


  const startDate =
    document
      .getElementById(
        "pStartDate"
      )
      .value;


  const panelProvider =
    document
      .getElementById(
        "pPanel"
      )
      .value;


  const otherPanelName =
    document
      .getElementById(
        "pOtherPanel"
      )
      .value
      .trim();


  const doctor =
    document
      .getElementById(
        "pDoctor"
      )
      .value
      .trim();



  /* =======================================================
     REQUIRED FIELDS
  ======================================================== */

  if(!name){

    alert(
      "Please enter the patient name."
    );

    return;

  }


  if(!patientId){

    alert(
      "Please enter the Patient ID."
    );

    return;

  }



  /* =======================================================
     DUPLICATE ID
  ======================================================== */

  const duplicate =
    store()
      .patients
      .some(
        patient =>

          patient.id
            .toLowerCase() ===
          patientId
            .toLowerCase()
      );


  if(duplicate){

    alert(
      "This Patient ID already exists."
    );

    return;

  }



  /* =======================================================
     INITIALS
  ======================================================== */

  const initials =

    name

      .split(
        /\s+/
      )

      .filter(
        Boolean
      )

      .map(
        part =>
          part
            .charAt(
              0
            )
      )

      .join("")

      .slice(
        0,
        2
      )

      .toUpperCase();



  /* =======================================================
     CREATE PATIENT
  ======================================================== */

  const patient = {

    id:
      patientId,


    name:
      name,


    initials:
      initials ||
      "PT",


    status:
      "Active",


    panelProvider:
      panelProvider,


    otherPanelName:

      panelProvider ===
      "Other"

        ? otherPanelName

        : "",


    startDate:
      startDate ||


      new Date()
        .toISOString()
        .slice(
          0,
          10
        ),


    doctor:
      doctor,


    phone:
      phone,


    dob:
      dob,


    gender:
      gender,


    height:
      height,


    startingWeight:
      startingWeight,


    currentWeight:
      startingWeight,


    goalWeight:
      goalWeight,


    visits:[],


    claims:[],


    appointments:[],


    measurements:[]

  };



  /* =======================================================
     SAVE
  ======================================================== */

  upsertPatient(
    patient
  );



  /* =======================================================
     CLOSE
  ======================================================== */

  closeAdd();



  /* =======================================================
     CLEAR
  ======================================================== */

  document.getElementById(
    "pName"
  ).value = "";


  document.getElementById(
    "pId"
  ).value = "";


  document.getElementById(
    "pPhone"
  ).value = "";


  document.getElementById(
    "pDob"
  ).value = "";


  document.getElementById(
    "pGender"
  ).value = "";


  document.getElementById(
    "pHeight"
  ).value = "";


  document.getElementById(
    "pStart"
  ).value = "";


  document.getElementById(
    "pGoal"
  ).value = "";


  document.getElementById(
    "pStartDate"
  ).value = "";


  document.getElementById(
    "pPanel"
  ).value = "SELF_PAY";


  document.getElementById(
    "pOtherPanel"
  ).value = "";


  document.getElementById(
    "pDoctor"
  ).value = "";


  document.getElementById(
    "otherPanelGroup"
  ).style.display =
    "none";



  /* =======================================================
     REFRESH
  ======================================================== */

  renderPatients();

  renderNotifications();



  /* =======================================================
     OPEN NEW PATIENT
  ======================================================== */

  setTimeout(
    () => {

      window.location.href =
        "patient-profile.html?patient=" +
        encodeURIComponent(
          patient.id
        );

    },
    250
  );

}



/* =========================================================
   INITIAL RENDER
========================================================= */

renderPatients();

renderNotifications();

</script>


</body>
</html>
