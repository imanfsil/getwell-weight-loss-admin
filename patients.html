<!doctype html>

<html>
<head>

<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Patients | Getwell</title>

<link
  rel="stylesheet"
  href="styles.css"
>

<script src="app.js"></script>

</head>

<body>

<div id="root"></div>


<div
  class="modal-wrap"
  id="addPatientModal"
>

  <div class="modal">

    <div class="modal-head">

      <div>

        <h2>
          Add Patient
        </h2>

        <p>
          Create one patient record.
        </p>

      </div>

      <button
        class="modal-close"
        onclick="closeAdd()"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <div class="form-grid">

        <div class="form-group">
          <label>
            Full Name
          </label>

          <input id="pName">
        </div>


        <div class="form-group">
          <label>
            Patient ID
          </label>

          <input id="pId">
        </div>


        <div class="form-group">
          <label>
            Phone
          </label>

          <input id="pPhone">
        </div>


        <div class="form-group">
          <label>
            Date of Birth
          </label>

          <input
            id="pDob"
            type="date"
          >
        </div>


        <div class="form-group">
          <label>
            Height (cm)
          </label>

          <input
            id="pHeight"
            type="number"
          >
        </div>


        <div class="form-group">
          <label>
            Starting Weight (kg)
          </label>

          <input
            id="pStart"
            type="number"
          >
        </div>


        <div class="form-group">
          <label>
            Goal Weight (kg)
          </label>

          <input
            id="pGoal"
            type="number"
          >
        </div>


        <div class="form-group">

          <label>
            Panel / Insurance
          </label>

          <select id="pPanel">

            <option value="SELF_PAY">
              Self-Pay
            </option>

            <option value="PANEL_A">
              Panel A
            </option>

            <option value="PANEL_B">
              Panel B
            </option>

            <option value="PANEL_C">
              Panel C
            </option>

            <option value="Other">
              Other Panel
            </option>

          </select>

        </div>

      </div>

    </div>


    <div class="modal-foot">

      <button
        class="secondary"
        onclick="closeAdd()"
      >
        Cancel
      </button>

      <button
        class="primary"
        onclick="savePatient()"
      >
        Save Patient
      </button>

    </div>

  </div>

</div>


<script>

function openAdd() {

  document
    .getElementById(
      "addPatientModal"
    )
    .classList.add("show");

}

function closeAdd() {

  document
    .getElementById(
      "addPatientModal"
    )
    .classList.remove("show");

}


document.getElementById(
  "root"
).innerHTML =

  shell(
    "Patients",
    "Weight Loss Program Management",
    "patients",
    `

      <div class="page-head">

        <div>

          <h1>
            Patients
          </h1>

          <p>
            Manage patient records and monitor program participation.
          </p>

        </div>

        <button
          class="primary"
          onclick="openAdd()"
        >
          ＋ Add Patient
        </button>

      </div>


      <div
        class="kpi-grid"
        id="patientKpis"
      ></div>


      <div class="card">

        <div class="card-head">

          <div>

            <h2>
              Patient List
            </h2>

            <p>
              One source of truth for patient details.
            </p>

          </div>

          <input
            class="claim-input"
            id="patientSearch"
            placeholder="Search patient name or ID"
            oninput="renderPatients(this.value)"
          >

        </div>


        <div class="table-wrap">

          <table class="table">

            <thead>

              <tr>
                <th>Patient</th>
                <th>ID</th>
                <th>Panel / Payment</th>
                <th>Current</th>
                <th>Goal</th>
                <th>Last Visit</th>
                <th>Status</th>
                <th></th>
              </tr>

            </thead>

            <tbody id="patientRows"></tbody>

          </table>

        </div>

      </div>

    `
  );


function renderPatients(q = "") {

  const patients =
    store().patients.filter(
      p =>
        (p.name + " " + p.id)
          .toLowerCase()
          .includes(q.toLowerCase())
    );


  document.getElementById(
    "patientRows"
  ).innerHTML =

    patients
      .map(
        p => {

          const visit =
            latestVisit(p);

          return `
            <tr>

              <td>

                <strong>
                  ${p.name}
                </strong>

                <div
                  style="
                    font-size:7px;
                    color:#94A3B8
                  "
                >
                  ${p.id}
                </div>

              </td>


              <td>
                ${p.id}
              </td>


              <td>

                <span class="panel-chip">
                  ${getPanelName(p)}
                </span>

              </td>


              <td>
                ${p.currentWeight || "—"} kg
              </td>


              <td>
                ${p.goalWeight || "—"} kg
              </td>


              <td>
                ${visit?.dateKey || "—"}
              </td>


              <td>

                <span
                  class="badge ${
                    p.status === "Active"
                      ? "green"
                      : "gray"
                  }"
                >
                  ${p.status}
                </span>

              </td>


              <td>

                <a
                  class="secondary"
                  style="padding:7px 9px"
                  href="patient-profile.html?patient=${p.id}"
                >
                  Open →
                </a>

              </td>

            </tr>
          `;
        }
      )
      .join("")

    ||

    `
      <tr>
        <td colspan="8">
          No patients found.
        </td>
      </tr>
    `;


  const all =
    store().patients;


  document.getElementById(
    "patientKpis"
  ).innerHTML = `

    <div class="kpi">
      <div class="kpi-label">
        TOTAL
      </div>
      <div class="kpi-value">
        ${all.length}
      </div>
    </div>


    <div class="kpi">
      <div class="kpi-label">
        ACTIVE
      </div>
      <div class="kpi-value">
        ${
          all.filter(
            p => p.status === "Active"
          ).length
        }
      </div>
    </div>


    <div class="kpi">
      <div class="kpi-label">
        COMPLETED
      </div>
      <div class="kpi-value">
        ${
          all.filter(
            p => p.status === "Completed"
          ).length
        }
      </div>
    </div>


    <div class="kpi">
      <div class="kpi-label">
        INACTIVE
      </div>
      <div class="kpi-value">
        ${
          all.filter(
            p => p.status === "Inactive"
          ).length
        }
      </div>
    </div>

  `;
}


function savePatient() {

  const name =
    document.getElementById(
      "pName"
    ).value.trim();

  const patientId =
    document.getElementById(
      "pId"
    ).value.trim();


  if (!patientId || !name) {
    alert(
      "Patient name and ID are required."
    );
    return;
  }


  const patient = {

    id: patientId,

    name,

    initials:
      name
        .split(/\s+/)
        .map(
          part => part[0]
        )
        .join("")
        .slice(0,2)
        .toUpperCase(),

    status: "Active",

    panelProvider:
      document.getElementById(
        "pPanel"
      ).value,

    startDate:
      new Date()
        .toISOString()
        .slice(0,10),

    goalWeight:
      +document.getElementById(
        "pGoal"
      ).value || 0,

    currentWeight:
      +document.getElementById(
        "pStart"
      ).value || 0,

    startingWeight:
      +document.getElementById(
        "pStart"
      ).value || 0,

    phone:
      document.getElementById(
        "pPhone"
      ).value,

    dob:
      document.getElementById(
        "pDob"
      ).value,

    height:
      document.getElementById(
        "pHeight"
      ).value,

    visits: []

  };


  upsertPatient(patient);

  closeAdd();

  renderPatients();

  renderNotifications();

}

renderPatients();

</script>

</body>
</html>
