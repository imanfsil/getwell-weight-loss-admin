/* =========================================================
   MONTH HELPERS
========================================================= */

function pad2(n){
  return String(n).padStart(2,"0");
}

function monthLabel(key){
  const [y,m] = key.split("-").map(Number);
  return new Date(y,m-1,1).toLocaleDateString("en-MY",{
    month:"long",
    year:"numeric"
  });
}

function getCurrentMonthKey(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
}

function getMonthRange(key){
  const [year,month] = key.split("-").map(Number);
  const start = `${year}-${pad2(month)}-01`;
  const lastDay = new Date(year,month,0).getDate();
  const end = `${year}-${pad2(month)}-${pad2(lastDay)}`;
  return {year,month,start,end,lastDay};
}

function isDateInMonth(dateValue,range){
  const d = String(dateValue || "").slice(0,10);
  return !!d && d >= range.start && d <= range.end;
}

function dateDisplay(dateValue){
  if(!dateValue) return "—";
  const [y,m,d] = String(dateValue).slice(0,10).split("-");
  if(!y || !m || !d) return dateValue;
  return `${d}/${m}/${y}`;
}


/* =========================================================
   MONTH SELECTOR
========================================================= */

function buildMonthSelector(){
  const select = document.getElementById("reportMonth");
  if(!select) return;

  const current = getCurrentMonthKey();
  const [currentYear,currentMonth] = current.split("-").map(Number);
  const options = [];

  // Show the current year plus the previous year.
  for(let y=currentYear; y>=currentYear-1; y--){
    const maxMonth = y === currentYear ? currentMonth : 12;
    const minMonth = 1;
    for(let m=maxMonth; m>=minMonth; m--){
      const key = `${y}-${pad2(m)}`;
      options.push(`<option value="${key}">${monthLabel(key)}</option>`);
    }
  }

  select.innerHTML = options.join("");
  select.value = current;
}


/* =========================================================
   REPORT DATA
========================================================= */

function getReportData(monthKey){

  const range = getMonthRange(monthKey);
  const patients = store().patients || [];

  const visits = [];
  const appointments = [];
  const claims = [];

  patients.forEach(patient => {

    (patient.visits || []).forEach(visit => {
      const date = visit.dateKey || visit.date || "";
      if(isDateInMonth(date,range)){
        visits.push({
          ...visit,
          patientId:patient.id,
          patientName:patient.name,
          patient
        });
      }
    });

    (patient.appointments || []).forEach(appointment => {
      if(isDateInMonth(appointment.date,range)){
        appointments.push({
          ...appointment,
          patientId:patient.id,
          patientName:patient.name,
          patient
        });
      }
    });

    (patient.claims || []).forEach(claim => {
      if(isDateInMonth(claim.claimDate,range)){
        claims.push({
          ...claim,
          patientId:patient.id,
          patientName:patient.name,
          patient
        });
      }
    });
  });


  /* -------------------------
     Revenue
  ------------------------- */

  let revenue = 0;
  let injection = 0;
  let medication = 0;
  let treatment = 0;
  let other = 0;
  let panelRevenue = 0;
  let selfPayRevenue = 0;

  visits.forEach(v => {
    const b = ensureVisit(v).billing;
    const total = visitTotal(v);

    revenue += total;
    injection += +b.injection.price || 0;
    medication += +b.medication.price || 0;
    treatment += +b.treatment.price || 0;
    other += +b.other.price || 0;

    if(patientUsesPanel(v.patient)) panelRevenue += total;
    else selfPayRevenue += total;
  });


  /* -------------------------
     Patients
  ------------------------- */

  const newPatients = patients.filter(p =>
    isDateInMonth(p.startDate || p.programStartDate,range)
  );

  const monthPatientIds = new Set(visits.map(v => v.patientId));
  const returningPatients = Math.max(
    0,
    monthPatientIds.size - new Set(newPatients.map(p => p.id)).size
  );

  const activePatients = patients.filter(p => {
    const start = String(p.startDate || p.programStartDate || "").slice(0,10);
    return start && start <= range.end && p.status === "Active";
  });

  const completedPrograms = patients.filter(p => {
    const status = String(p.status || "").toLowerCase();
    return (status === "completed" || status === "goal achieved") &&
      String(p.startDate || p.programStartDate || "") <= range.end;
  });

  const inactivePatients = patients.filter(p =>
    String(p.status || "").toLowerCase() === "inactive"
  );


  /* -------------------------
     Visit summary
  ------------------------- */

  const visitPatients = new Set(visits.map(v => v.patientId));
  const completedVisits = visits.filter(v =>
    String(v.status || "Completed").toLowerCase() === "completed"
  ).length;

  const totalVisits = visits.length;


  /* -------------------------
     Panel report
  ------------------------- */

  const panelMap = {};

  visits.forEach(v => {
    if(!patientUsesPanel(v.patient)) return;

    const panel = getPanelName(v.patient);
    if(!panelMap[panel]){
      panelMap[panel] = {
        panel,
        patients:new Set(),
        invoiced:0,
        claimed:0
      };
    }

    panelMap[panel].patients.add(v.patientId);
    panelMap[panel].invoiced += visitTotal(v);
  });

  claims.forEach(c => {
    if(!patientUsesPanel(c.patient)) return;

    const panel = getPanelName(c.patient);
    if(!panelMap[panel]){
      panelMap[panel] = {
        panel,
        patients:new Set(),
        invoiced:0,
        claimed:0
      };
    }

    panelMap[panel].patients.add(c.patientId);
    panelMap[panel].claimed += +c.amount || 0;
  });

  const panelRows = Object.values(panelMap)
    .map(x => ({
      ...x,
      patients:x.patients.size,
      balance:Math.max(0,x.invoiced-x.claimed)
    }))
    .sort((a,b)=>b.invoiced-a.invoiced);


  /* -------------------------
     Suspended policies
  ------------------------- */

  const suspendedPatients = patients.filter(p =>
    isPanelSuspended(p) && finance(p).balance > 0
  );

  const suspendedOutstanding = suspendedPatients.reduce(
    (sum,p)=>sum + finance(p).balance,
    0
  );


  /* -------------------------
     Appointment summary
  ------------------------- */

  const appointmentStatus = {
    total:appointments.length,
    completed:appointments.filter(a=>a.status==="Completed").length,
    upcoming:appointments.filter(a=>a.status==="Upcoming").length,
    noShow:appointments.filter(a=>a.status==="No Show").length,
    cancelled:appointments.filter(a=>a.status==="Cancelled").length
  };

  const attendanceBase =
    appointmentStatus.completed + appointmentStatus.noShow;

  const attendanceRate = attendanceBase
    ? Math.round((appointmentStatus.completed / attendanceBase) * 100)
    : 0;


  return {
    monthKey,
    monthLabel:monthLabel(monthKey),
    range,
    patients,
    visits,
    appointments,
    claims,
    revenue,
    injection,
    medication,
    treatment,
    other,
    panelRevenue,
    selfPayRevenue,
    newPatients,
    returningPatients,
    activePatients,
    completedPrograms,
    inactivePatients,
    visitPatients,
    totalVisits,
    completedVisits,
    panelRows,
    suspendedPatients,
    suspendedOutstanding,
    appointmentStatus,
    attendanceRate
  };
}


/* =========================================================

function reportMoney(n){

}

function emptyRow(colspan,text){
  return `
    <tr>
      <td colspan="${colspan}" style="text-align:center;padding:28px;color:var(--muted)">
        ${text}
      </td>
    </tr>
  `;
}

function statusBadge(status){
  const s = String(status || "").toLowerCase();
  let cls = "orange";
  if(s === "completed") cls = "green";
  if(s === "cancelled" || s === "no show") cls = "red";
  return `<span class="badge ${cls}">${status || "—"}</span>`;
}

/* =========================================================
   PDF
========================================================= */

let pdfLibraryPromise = null;

function loadPDFLibrary(){
  if(window.jspdf?.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if(pdfLibraryPromise) return pdfLibraryPromise;

  pdfLibraryPromise = new Promise((resolve,reject)=>{
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    script.onload = () => {
      if(window.jspdf?.jsPDF) resolve(window.jspdf.jsPDF);
      else reject(new Error("PDF library unavailable."));
    };
    script.onerror = () => reject(new Error("Unable to load PDF library."));
    document.head.appendChild(script);
  });

  return pdfLibraryPromise;
}

function pdfMoney(n){
  return `RM ${Number(n||0).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
}

function addPDFHeader(doc,data){
  doc.setFont("helvetica","bold");
  doc.setFontSize(17);
  doc.text("GETWELL CLINIC",40,42);

  doc.setFontSize(13);
  doc.text("Monthly Performance Report",40,61);

  doc.setFont("helvetica","normal");
  doc.setFontSize(9);
  doc.text(data.monthLabel,40,76);
  doc.text(`Report period: ${data.range.start} to ${data.range.end}`,40,90);

  doc.setDrawColor(210,218,230);
  doc.line(40,101,552,101);
}

function ensurePDFSpace(doc,y,needed=30){
  if(y + needed <= 800) return y;
  doc.addPage();
  return 42;
}

function pdfSectionTitle(doc,title,y){
  y = ensurePDFSpace(doc,y,28);
  doc.setFont("helvetica","bold");
  doc.setFontSize(11);
  doc.text(title,40,y);
  return y+18;
}

function pdfRow(doc,label,value,y){
  y = ensurePDFSpace(doc,y,18);
  doc.setFont("helvetica","normal");
  doc.setFontSize(9);
  doc.text(String(label),48,y);
  doc.text(String(value),552,y,{align:"right"});
  return y+16;
}

function pdfTable(doc,headers,rows,y,widths){
  const x0 = 40;
  const rowH = 20;
  const totalW = widths.reduce((a,b)=>a+b,0);

  y = ensurePDFSpace(doc,y,rowH*(Math.min(rows.length,25)+2));

  doc.setFillColor(236,242,250);
  doc.rect(x0,y-13,totalW,rowH,"F");

  doc.setFont("helvetica","bold");
  doc.setFontSize(8);

  let x = x0;
  headers.forEach((h,i)=>{
    doc.text(String(h),x+6,y);
    x += widths[i];
  });

  y += rowH;

  doc.setFont("helvetica","normal");

  rows.forEach(row=>{
    y = ensurePDFSpace(doc,y,rowH+8);
    let xx=x0;
    row.forEach((cell,i)=>{
      const text=String(cell ?? "—");
      doc.text(text,xx+6,y);
      xx += widths[i];
    });
    doc.setDrawColor(225,231,239);
    doc.line(x0,y+6,x0+totalW,y+6);
    y += rowH;
  });

  return y+8;
}

async function downloadReportPDF(){

  const monthKey =
    document.getElementById("reportMonth")?.value ||
    getCurrentMonthKey();

  const data = getReportData(monthKey);

  try{
    const jsPDF = await loadPDFLibrary();
    const doc = new jsPDF({orientation:"portrait",unit:"pt",format:"a4"});

    addPDFHeader(doc,data);

    let y = 125;

    y = pdfSectionTitle(doc,"Performance Overview",y);

    y = pdfRow(doc,"Total Revenue",pdfMoney(data.revenue),y);
    y = pdfRow(doc,"Total Visits",data.totalVisits,y);
    y = pdfRow(doc,"New Patients",data.newPatients.length,y);
    y = pdfRow(doc,"Active Patients",data.activePatients.length,y);

    y += 8;
    y = pdfSectionTitle(doc,"Revenue Breakdown",y);
    y = pdfRow(doc,"Injection",pdfMoney(data.injection),y);
    y = pdfRow(doc,"Medication",pdfMoney(data.medication),y);
    y = pdfRow(doc,"Treatment",pdfMoney(data.treatment),y);
    y = pdfRow(doc,"Other",pdfMoney(data.other),y);
    y = pdfRow(doc,"Total Revenue",pdfMoney(data.revenue),y);

    y += 8;
    y = pdfSectionTitle(doc,"Patient Activity",y);
    y = pdfRow(doc,"New Patients",data.newPatients.length,y);
    y = pdfRow(doc,"Returning Patients",data.returningPatients,y);
    y = pdfRow(doc,"Completed Programs",data.completedPrograms.length,y);
    y = pdfRow(doc,"Inactive Patients",data.inactivePatients.length,y);

    y += 8;
    y = pdfSectionTitle(doc,"Visit Summary",y);
    y = pdfRow(doc,"Total Visits",data.totalVisits,y);
    y = pdfRow(doc,"Completed Visits",data.completedVisits,y);
    y = pdfRow(doc,"Panel Revenue",pdfMoney(data.panelRevenue),y);
    y = pdfRow(doc,"Self-Pay Revenue",pdfMoney(data.selfPayRevenue),y);

    y += 8;
    y = pdfSectionTitle(doc,"Panel Performance",y);
    y = pdfTable(
      doc,
      ["Panel","Patients","Invoiced","Claimed","Balance"],
      data.panelRows.map(r=>[
        r.panel,
        r.patients,
        pdfMoney(r.invoiced),
        pdfMoney(r.claimed),
        pdfMoney(r.balance)
      ]),
      y,
      [105,65,115,115,112]
    );

    y += 8;
    y = pdfSectionTitle(doc,"Suspended Policies",y);
    y = pdfRow(doc,"Suspended Patients",data.suspendedPatients.length,y);
    y = pdfRow(doc,"Total Outstanding",pdfMoney(data.suspendedOutstanding),y);

    if(data.suspendedPatients.length){
      y += 5;
      y = pdfTable(
        doc,
        ["Patient","Panel","Outstanding","Status"],
        data.suspendedPatients.map(p=>[
          `${p.name} (${p.id})`,
          getPanelName(p),
          pdfMoney(finance(p).balance),
          "SUSPENDED"
        ]),
        y,
        [250,95,105,62]
      );
    }

    y += 8;
    y = pdfSectionTitle(doc,"Appointment Performance",y);
    y = pdfRow(doc,"Total Appointments",data.appointmentStatus.total,y);
    y = pdfRow(doc,"Completed",data.appointmentStatus.completed,y);
    y = pdfRow(doc,"Upcoming",data.appointmentStatus.upcoming,y);
    y = pdfRow(doc,"No Show",data.appointmentStatus.noShow,y);
    y = pdfRow(doc,"Cancelled",data.appointmentStatus.cancelled,y);
    y = pdfRow(doc,"Attendance Rate",`${data.attendanceRate}%`,y);

    const pageCount = doc.getNumberOfPages();
    for(let page=1;page<=pageCount;page++){
      doc.setPage(page);
      doc.setFont("helvetica","normal");
      doc.setFontSize(7.5);
      doc.setTextColor(100,116,139);
      doc.text(
        `Getwell Clinic · ${data.monthLabel} · Page ${page} of ${pageCount}`,
        40,
        820
      );
      doc.setTextColor(0,0,0);
    }

    doc.save(`Getwell-Clinic-Report-${monthKey}.pdf`);

  }catch(error){
    console.error(error);
    alert("The PDF generator could not load. The report will open in print mode so you can choose Save as PDF.");
    window.print();
  }
}
