/* =========================================================
   DATE HELPERS
========================================================= */

function pad2(n){

  return String(n)
    .padStart(2,"0");

}


function getCurrentMonthKey(){

  const d =
    new Date();

  return (
    d.getFullYear()
    + "-"
    +
    pad2(
      d.getMonth()+1
    )
  );

}


function monthLabel(key){

  const [
    year,
    month
  ] =
    key
      .split("-")
      .map(Number);


  return new Date(
    year,
    month - 1,
    1
  )
  .toLocaleDateString(
    "en-MY",
    {
      month:"long",
      year:"numeric"
    }
  );

}


function getMonthRange(key){

  const [
    year,
    month
  ] =
    key
      .split("-")
      .map(Number);


  const start =
    `${year}-${pad2(month)}-01`;


  const lastDay =
    new Date(
      year,
      month,
      0
    )
    .getDate();


  const end =
    `${year}-${pad2(month)}-${pad2(lastDay)}`;


  return {
    year,
    month,
    start,
    end
  };

}


function isDateInMonth(
  dateValue,
  range
){

  const date =
    String(
      dateValue || ""
    )
    .slice(
      0,
      10
    );


  return (
    date &&
    date >= range.start &&
    date <= range.end
  );

}


function dateDisplay(
  dateValue
){

  if(!dateValue)
    return "—";


  const [
    y,
    m,
    d
  ] =
    String(
      dateValue
    )
    .slice(
      0,
      10
    )
    .split("-");


  if(
    !y ||
    !m ||
    !d
  ){

    return dateValue;

  }


  return `${d}/${m}/${y}`;

}


/* =========================================================
   MONTH SELECTOR
========================================================= */

function buildMonthSelector(){

  const select =
    document.getElementById(
      "reportMonth"
    );

  if(!select)
    return;

  const current =
    getCurrentMonthKey();

  const [
    currentYear,
    currentMonth
  ] =
    current
      .split("-")
      .map(Number);

  /*
    REPORT MONTH RANGE

    Reports are available from September 2025
    through the current month.

    Do not show months before September 2025.
  */

  const MIN_REPORT_YEAR = 2025;
  const MIN_REPORT_MONTH = 9; // September

  const options = [];

  for(
    let year=currentYear;
    year>=MIN_REPORT_YEAR;
    year--
  ){

    const maxMonth =
      year === currentYear
        ? currentMonth
        : 12;

    const minMonth =
      year === MIN_REPORT_YEAR
        ? MIN_REPORT_MONTH
        : 1;

    for(
      let month=maxMonth;
      month>=minMonth;
      month--
    ){

      const key =
        `${year}-${pad2(month)}`;

      options.push(`
        <option value="${key}">
          ${monthLabel(key)}
        </option>
      `);

    }

  }

  select.innerHTML =
    options.join("");

  /*
    Keep the current month selected.
  */

  if(
    [...select.options]
      .some(option => option.value === current)
  ){

    select.value =
      current;

  }else if(
    select.options.length
  ){

    select.selectedIndex = 0;

  }

}


/* =========================================================
   RETURNING PATIENT LOGIC

   Definition:
   Patient has a new visit during the selected month,
   and the previous visit was at least one month earlier.
========================================================= */

function isAtLeastOneMonthApart(
  previousDate,
  currentDate
){

  if(
    !previousDate ||
    !currentDate
  ){

    return false;

  }


  const previous =
    new Date(
      previousDate +
      "T00:00:00"
    );


  const current =
    new Date(
      currentDate +
      "T00:00:00"
    );


  const minimumReturnDate =
    new Date(
      previous
    );


  minimumReturnDate.setMonth(
    minimumReturnDate.getMonth()+1
  );


  return (
    current >=
    minimumReturnDate
  );

}


function getReturningPatientIds(
  patients,
  range
){

  const returning =
    new Set();


  patients.forEach(
    patient => {

      const visits =
        (patient.visits || [])
          .map(
            visit => {

              const date =
                String(
                  visit.dateKey ||
                  visit.date ||
                  ""
                )
                .slice(
                  0,
                  10
                );


              if(!date)
                return null;


              return {
                date
              };

            }
          )
          .filter(Boolean)
          .sort(
            (a,b)=>
              a.date.localeCompare(
                b.date
              )
          );


      if(
        visits.length < 2
      ){

        return;

      }


      for(
        let i=1;
        i<visits.length;
        i++
      ){

        const current =
          visits[i];


        const previous =
          visits[i-1];


        /*
          The new visit must be
          inside the selected month.
        */

        if(
          !isDateInMonth(
            current.date,
            range
          )
        ){

          continue;

        }


        /*
          Previous visit must be
          at least one month earlier.
        */

        if(
          isAtLeastOneMonthApart(
            previous.date,
            current.date
          )
        ){

          returning.add(
            patient.id
          );


          break;

        }

      }

    }
  );


  return returning;

}


/* =========================================================
   REPORT DATA
========================================================= */

function getReportData(
  monthKey
){

  const range =
    getMonthRange(
      monthKey
    );


  const patients =
    store().patients || [];


  const visits = [];

  const appointments = [];

  const claims = [];


  patients.forEach(
    patient => {

      /*
        VISITS
      */

      (
        patient.visits ||
        []
      )
      .forEach(
        visit => {

          const date =
            visit.dateKey ||
            visit.date ||
            "";


          if(
            isDateInMonth(
              date,
              range
            )
          ){

            visits.push({

              ...visit,

              patientId:
                patient.id,

              patientName:
                patient.name,

              patient

            });

          }

        }
      );


      /*
        APPOINTMENTS
      */

      (
        patient.appointments ||
        []
      )
      .forEach(
        appointment => {

          if(
            isDateInMonth(
              appointment.date,
              range
            )
          ){

            appointments.push({

              ...appointment,

              patientId:
                patient.id,

              patientName:
                patient.name,

              patient

            });

          }

        }
      );


      /*
        CLAIMS
      */

      (
        patient.claims ||
        []
      )
      .forEach(
        claim => {

          if(
            isDateInMonth(
              claim.claimDate,
              range
            )
          ){

            claims.push({

              ...claim,

              patientId:
                patient.id,

              patientName:
                patient.name,

              patient

            });

          }

        }
      );

    }
  );


  /* =======================================================
     REVENUE
  ======================================================== */

  let revenue = 0;

  let injection = 0;

  let medication = 0;

  let treatment = 0;

  let other = 0;

  let panelRevenue = 0;

  let selfPayRevenue = 0;


  visits.forEach(
    visit => {

      const billing =
        ensureVisit(
          visit
        ).billing;


      const total =
        visitTotal(
          visit
        );


      revenue +=
        total;


      /*
        Read the canonical charges array (same source as
        visitTotal and app.js finance()). The old code read
        the legacy visit.billing.*.price mirror fields, which
        are only rewritten when a visit is saved from this
        browser -- so any visit arriving from the Google Sheet
        showed a correct Total Revenue with every category
        sitting at RM 0.00.
      */

      injection +=
        visitCategoryTotal(visit,"Injection");


      medication +=
        visitCategoryTotal(visit,"Medication");


      treatment +=
        visitCategoryTotal(visit,"Treatment");


      other +=
        visitCategoryTotal(visit,"Additional");


      if(
        patientUsesPanel(
          visit.patient
        )
      ){

        panelRevenue +=
          total;

      }else{

        selfPayRevenue +=
          total;

      }

    }
  );


  /* =======================================================
     NEW PATIENTS
  ======================================================== */

  const newPatients =
    patients.filter(
      patient =>
        isDateInMonth(
          patient.startDate ||
          patient.programStartDate,
          range
        )
    );


  /* =======================================================
     RETURNING PATIENTS
  ======================================================== */

  const returningIds =
    getReturningPatientIds(
      patients,
      range
    );


  /*
    A new patient should not also
    appear as a returning patient.
  */

  newPatients.forEach(
    patient => {

      returningIds.delete(
        patient.id
      );

    }
  );


  const returningPatients =
    returningIds.size;


  /* =======================================================
     ACTIVE PATIENTS
  ======================================================== */

  const activePatients =
    patients.filter(
      patient => {

        const start =
          String(
            patient.startDate ||
            patient.programStartDate ||
            ""
          )
          .slice(
            0,
            10
          );


        return (
          start &&
          start <= range.end &&
          patient.status ===
            "Active"
        );

      }
    );


  /* =======================================================
     COMPLETED PROGRAMS
  ======================================================== */

  const completedPrograms =
    patients.filter(
      patient => {

        const status =
          String(
            patient.status ||
            ""
          )
          .toLowerCase();


        return (
          status ===
            "completed" ||
          status ===
            "goal achieved"
        );

      }
    );


  /* =======================================================
     INACTIVE
  ======================================================== */

  const inactivePatients =
    patients.filter(
      patient =>
        String(
          patient.status ||
          ""
        )
        .toLowerCase() ===
        "inactive"
    );


  /* =======================================================
     VISITS
  ======================================================== */

  const totalVisits =
    visits.length;


  const completedVisits =
    visits.filter(
      visit =>
        String(
          visit.status ||
          "Completed"
        )
        .toLowerCase() ===
        "completed"
    ).length;


  /* =======================================================
     PANEL PERFORMANCE
  ======================================================== */

  const panelMap = {};


  visits.forEach(
    visit => {

      if(
        !patientUsesPanel(
          visit.patient
        )
      ){

        return;

      }


      const panel =
        getPanelName(
          visit.patient
        );


      if(
        !panelMap[panel]
      ){

        panelMap[panel] = {

          panel,

          patients:
            new Set(),

          invoiced:0,

          claimed:0

        };

      }


      panelMap[
        panel
      ]
      .patients
      .add(
        visit.patientId
      );


      panelMap[
        panel
      ]
      .invoiced +=
        visitTotal(
          visit
        );

    }
  );


  claims.forEach(
    claim => {

      if(
        !patientUsesPanel(
          claim.patient
        )
      ){

        return;

      }


      const panel =
        getPanelName(
          claim.patient
        );


      if(
        !panelMap[panel]
      ){

        panelMap[panel] = {

          panel,

          patients:
            new Set(),

          invoiced:0,

          claimed:0

        };

      }


      panelMap[
        panel
      ]
      .patients
      .add(
        claim.patientId
      );


      panelMap[
        panel
      ]
      .claimed +=
        +claim.amount ||
        0;

    }
  );


  const panelRows =
    Object.values(
      panelMap
    )
    .map(
      row => ({

        panel:
          row.panel,

        patients:
          row.patients.size,

        invoiced:
          row.invoiced,

        claimed:
          row.claimed,

        balance:
          Math.max(
            0,
            row.invoiced -
            row.claimed
          )

      })
    )
    .sort(
      (a,b)=>
        b.invoiced -
        a.invoiced
    );


  /* =======================================================
     SUSPENDED POLICIES
  ======================================================== */

  const suspendedPatients =
    patients.filter(
      patient =>
        isPanelSuspended(
          patient
        ) &&
        finance(
          patient
        ).balance > 0
    );


  const suspendedOutstanding =
    suspendedPatients.reduce(
      (
        total,
        patient
      ) =>
        total +
        finance(
          patient
        ).balance,
      0
    );


  /* =======================================================
     APPOINTMENTS
  ======================================================== */

  const appointmentStatus = {

    total:
      appointments.length,

    completed:
      appointments.filter(
        appointment =>
          appointment.status ===
          "Completed"
      ).length,

    upcoming:
      appointments.filter(
        appointment =>
          appointment.status ===
          "Upcoming"
      ).length,

    noShow:
      appointments.filter(
        appointment =>
          appointment.status ===
          "No Show"
      ).length,

    cancelled:
      appointments.filter(
        appointment =>
          appointment.status ===
          "Cancelled"
      ).length

  };


  /*
    Attendance excludes cancelled appointments.
  */

  const attendanceBase =
    appointmentStatus.completed +
    appointmentStatus.noShow;


  const attendanceRate =
    attendanceBase
      ? Math.round(
          (
            appointmentStatus.completed /
            attendanceBase
          ) * 100
        )
      : 0;


  return {

    monthKey,

    monthLabel:
      monthLabel(
        monthKey
      ),

    range,

    revenue,

    injection,

    medication,

    treatment,

    other,

    panelRevenue,

    selfPayRevenue,

    newPatients,

    returningPatients,

    activePatients,

    completedPrograms,

    inactivePatients,

    totalVisits,

    completedVisits,

    panelRows,

    suspendedPatients,

    suspendedOutstanding,

    appointmentStatus,

    attendanceRate

  };

}

/* =========================================================
   REPORT SECTION VISIBILITY

   Settings -> Reports writes these flags but nothing ever
   read them, so every section always rendered. Rather than
   restructure the template, each rendered card is matched by
   its heading and hidden when its flag is off. The KPI row
   belongs to Performance Overview.
========================================================= */

const REPORT_SECTION_FLAGS = {
  "Performance Overview":     "showPerformance",
  "Revenue Breakdown":        "showRevenue",
  "Patient Activity":         "showPatientActivity",
  "Visit Summary":            "showVisitSummary",
  "Panel Performance":        "showPanelPerformance",
  "Suspended Policies":       "showSuspendedPolicies",
  "Appointment Performance":  "showAppointmentPerformance"
};


function applyReportVisibility(){

  const flags =
    getwellReportSettings();


  const content =
    document.getElementById("reportContent");

  if(!content)
    return;


  content
    .querySelectorAll(".card")
    .forEach(card => {

      const heading =
        card.querySelector("h2");

      if(!heading)
        return;


      const key =
        REPORT_SECTION_FLAGS[
          heading.textContent.trim()
        ];

      if(!key)
        return;


      card.style.display =
        flags[key] === false
          ? "none"
          : "";

    });


  /* The KPI row is part of Performance Overview. */

  const kpis =
    content.querySelector(".kpi-grid");

  if(kpis){

    kpis.style.display =
      flags.showPerformance === false
        ? "none"
        : "";

  }


  /* Download PDF button. */

  const pdfButton =
    document.getElementById("downloadReportButton");

  if(pdfButton){

    pdfButton.style.display =
      flags.showDownloadPDF === false
        ? "none"
        : "";

  }

}

let pdfLibraryPromise =
  null;


function loadPDFLibrary(){

  if(
    window.jspdf &&
    window.jspdf.jsPDF
  ){

    return Promise.resolve(
      window.jspdf.jsPDF
    );

  }


  if(
    pdfLibraryPromise
  ){

    return pdfLibraryPromise;

  }


  pdfLibraryPromise =
    new Promise(
      (
        resolve,
        reject
      ) => {

        const script =
          document.createElement(
            "script"
          );


        script.src =
          "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";


        script.onload =
          () => {

            if(
              window.jspdf &&
              window.jspdf.jsPDF
            ){

              resolve(
                window.jspdf.jsPDF
              );

            }else{

              reject(
                new Error(
                  "PDF library unavailable."
                )
              );

            }

          };


        script.onerror =
          () => {

            reject(
              new Error(
                "Unable to load PDF library."
              )
            );

          };


        document.head.appendChild(
          script
        );

      }
    );


  return pdfLibraryPromise;

}


function pdfMoney(n){

  }`;

}

function ensurePDFSpace(
  doc,
  y,
  needed=30
){

  if(
    y + needed <= 800
  ){

    return y;

  }


  doc.addPage();


  return 42;

}


function pdfSectionTitle(
  doc,
  title,
  y
){

  y =
    ensurePDFSpace(
      doc,
      y,
      28
    );


  doc.setFont(
    "helvetica",
    "bold"
  );


  doc.setFontSize(
    11
  );


  doc.text(
    title,
    40,
    y
  );


  return y + 18;

}


function pdfRow(
  doc,
  label,
  value,
  y
){

  y =
    ensurePDFSpace(
      doc,
      y,
      18
    );


  doc.setFont(
    "helvetica",
    "normal"
  );


  doc.setFontSize(
    9
  );


  doc.text(
    String(label),
    48,
    y
  );


  doc.text(
    String(value),
    552,
    y,
    {
      align:"right"
    }
  );


  return y + 16;

}


function pdfTable(
  doc,
  headers,
  rows,
  y,
  widths
){

  const x0 =
    40;


  const rowH =
    20;


  const totalW =
    widths.reduce(
      (a,b) =>
        a+b,
      0
    );


  y =
    ensurePDFSpace(
      doc,
      y,
      80
    );


  doc.setFillColor(
    236,
    242,
    250
  );


  doc.rect(
    x0,
    y-13,
    totalW,
    rowH,
    "F"
  );


  doc.setFont(
    "helvetica",
    "bold"
  );


  doc.setFontSize(
    8
  );


  let x =
    x0;


  headers.forEach(
    (
      header,
      index
    ) => {

      doc.text(
        String(header),
        x+6,
        y
      );


      x +=
        widths[index];

    }
  );


  y +=
    rowH;


  doc.setFont(
    "helvetica",
    "normal"
  );


  rows.forEach(
    row => {

      y =
        ensurePDFSpace(
          doc,
          y,
          rowH+8
        );


      let xx =
        x0;


      row.forEach(
        (
          cell,
          index
        ) => {

          doc.text(
            String(
              cell ??
              "—"
            ),
            xx+6,
            y
          );


          xx +=
            widths[index];

        }
      );


      doc.setDrawColor(
        225,
        231,
        239
      );


      doc.line(
        x0,
        y+6,
        x0+totalW,
        y+6
      );


      y +=
        rowH;

    }
  );


  return y+8;

}
