<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel | Getwell</title><link rel="stylesheet" href="styles.css"><script src="app.js"></script></head><body><div id="root"></div><div class="modal-wrap" id="panelDetailModal"><div class="modal" style="width:min(1050px,96vw)"><div class="modal-head"><div><h2 id="panelDetailTitle">Panel Patient</h2><p id="panelDetailSub"></p></div><button class="modal-close" onclick="closePanelDetail()">×</button></div><div class="modal-body" id="panelDetailContent"></div></div></div>
<script>
function getPanelPatients(){return store().patients.filter(patientUsesPanel)}
function renderPanelKpis(){const ps=getPanelPatients();let g=0,c=0;ps.forEach(p=>{const f=finance(p);g+=f.grand;c+=f.claimed});panelKpis.innerHTML=`<div class="kpi"><div class="kpi-label">PANEL PATIENTS</div><div class="kpi-value">${ps.length}</div></div><div class="kpi"><div class="kpi-label">GRAND TOTAL</div><div class="kpi-value">${money(g)}</div></div><div class="kpi"><div class="kpi-label">TOTAL CLAIMED</div><div class="kpi-value">${money(c)}</div></div><div class="kpi"><div class="kpi-label">BALANCE TO CLAIM</div><div class="kpi-value">${money(Math.max(0,g-c))}</div></div>`}
function renderPanelPatients(q=""){const ps=getPanelPatients().filter(p=>(p.name+" "+p.id+" "+getPanelName(p)).toLowerCase().includes(q.toLowerCase()));panelRows.innerHTML=ps.map(p=>{const f=finance(p);return `<tr><td><strong>${p.name}</strong><div class="row-sub">${p.id}</div></td><td><span class="panel-chip">${getPanelName(p)}</span></td><td>${money(f.grand)}</td><td>${money(f.claimed)}</td><td><span class="badge ${f.balance>0?"orange":"green"}">${money(f.balance)}</span></td><td><button class="secondary" style="padding:7px 9px" onclick="openPanelDetail('${p.id}')">View Claims →</button></td></tr>`}).join("")||`<tr><td colspan="6" class="notif-empty">No panel patients found.</td></tr>`;renderPanelKpis()}
function openPanelDetail(pid){const p=getPatient(pid);if(!p)return;const f=finance(p),cs=ensureClaims(p);panelDetailTitle.textContent=p.name;panelDetailSub.textContent=`${p.id} · ${getPanelName(p)}`;panelDetailContent.innerHTML=`<div class="finance-grid"><div class="finance-card"><div class="label">GRAND TOTAL</div><div class="value">${money(f.grand)}</div></div><div class="finance-card"><div class="label">TOTAL CLAIMED</div><div class="value">${money(f.claimed)}</div></div><div class="finance-card balance"><div class="label">BALANCE TO CLAIM</div><div class="value">${money(f.balance)}</div></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px"><div><strong>Claim History</strong><div class="row-sub">Claims can be on the visit date, later date, or non-visit day.</div></div><a class="primary" style="padding:8px 11px" href="patient-profile.html?patient=${p.id}&openClaim=1">＋ Add Claim</a></div><div class="table-wrap"><table class="table"><thead><tr><th>Claim Date</th><th>Related Visit</th><th>Claim Amount</th><th>Notes</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${c.claimDate}</td><td>${p.visits.find(v=>v.id===c.visitId)?.visit||"No specific visit"}</td><td>${money(c.amount)}</td><td>${c.notes||"—"}</td></tr>`).join("")||`<tr><td colspan="4" class="notif-empty">No claims recorded.</td></tr>`}</tbody></table></div><div style="margin-top:22px"><strong>Visit History</strong><div class="table-wrap"><table class="table"><thead><tr><th>Visit</th><th>Date</th><th>Invoice</th></tr></thead><tbody>${(p.visits||[]).map(v=>`<tr><td>${v.visit}</td><td>${v.dateKey}</td><td>${money(visitTotal(v))}</td></tr>`).join("")||`<tr><td colspan="3" class="notif-empty">No visits.</td></tr>`}</tbody></table></div></div>`;panelDetailModal.classList.add("show")}
function closePanelDetail(){panelDetailModal.classList.remove("show")}
document.getElementById("root").innerHTML=shell("Panel","panel",`<div class="page-head"><div><h1>Panel Claims</h1><p>Track panel patients and remaining claim balances.</p></div></div><div class="kpi-grid" id="panelKpis"></div><div class="card"><div class="card-head"><div><h2>Panel Patients</h2><p>Only panel / insurance patients are listed.</p></div><input class="claim-input" style="max-width:240px" oninput="renderPanelPatients(this.value)" placeholder="Search patient or panel"></div><div class="table-wrap"><table class="table"><thead><tr><th>Patient</th><th>Panel</th><th>GRAND TOTAL</th><th>TOTAL CLAIMED</th><th>BALANCE TO CLAIM</th><th></th></tr></thead><tbody id="panelRows"></tbody></table></div></div>`);renderPanelPatients();renderNotifications();
</script></body></html>
