<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Appointments | Getwell</title>
<link rel="stylesheet" href="styles.css?v=20260831-bodycomp">
<script src="app.js?v=20260831-bodycomp"></script>
<style>
#appointmentModal.modal-wrap{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:rgba(17,24,39,.48);pointer-events:none;}
#appointmentModal.modal-wrap.show{display:flex!important;pointer-events:auto!important;}
#appointmentModal .modal{pointer-events:auto;}
</style></head>
<body>
<div id="root"></div>

<div class="modal-wrap" id="appointmentModal">
  <div class="modal">
    <div class="modal-head">
      <div><h2 id="appointmentModalTitle">Add Appointment</h2><p>Patient appointment scheduling</p></div>
      <button id="closeAppointmentTop" class="modal-close" type="button">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group full">
          <label>Patient</label>
          <div class="patient-picker" style="position:relative">
            <input id="appointmentPatientSearch" class="claim-input" autocomplete="off"
              placeholder="Search patient name or ID..."
              oninput="renderAppointmentPatientOptions(this.value)"
              onfocus="renderAppointmentPatientOptions(this.value)">
            <input id="appointmentPatient" type="hidden">
            <div id="appointmentPatientDropdown" class="combobox-menu" hidden></div>
            <div id="appointmentPatientSelected" class="picker-selected" hidden></div>
          </div>
        </div>

        <div class="form-group"><label>Date</label><input id="appointmentDate" type="date"></div>
        <div class="form-group"><label>Time</label><input id="appointmentTime" type="time"></div>
        <div class="form-group"><label>Doctor</label><select id="appointmentDoctor"></select></div>
        <div class="form-group"><label>Appointment Type</label><select id="appointmentType"></select></div>
        <div class="form-group"><label>Status</label><select id="appointmentStatus"></select></div>
        <div class="form-group"><label>Notes</label><input id="appointmentNotes"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button id="closeAppointmentButton" class="secondary" type="button">Cancel</button>
      <button id="deleteAppointmentButton" class="secondary" type="button" style="display:none">Delete</button>
      <button id="saveAppointmentButton" class="primary" type="button">Save Appointment</button>
    </div>
  </div>
</div>

<!-- =======================================================
     FOLLOW-UP MODAL
======================================================== -->
<div class="modal-wrap" id="followUpModal">
  <div class="modal" style="width:min(760px,96vw)">
    <div class="modal-head">
      <div>
        <h2>Follow Up Now</h2>
        <p id="followUpModalSub">Prepare a message for this patient.</p>
      </div>
      <button class="modal-close" type="button" aria-label="Close" onclick="closeFollowUpModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label>Patient</label>
          <input id="followUpPatientName" readonly>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <div style="display:flex;gap:8px;">
            <input id="followUpPatientPhone" readonly style="flex:1;min-width:0;">
            <button id="copyFollowUpNumberButton" class="secondary" type="button">Copy Number</button>
          </div>
        </div>
        <div class="form-group">
          <label>Follow-Up Status</label>
          <input id="followUpStatus" readonly>
        </div>
        <div class="form-group">
          <label>Last Visit</label>
          <input id="followUpLastVisit" readonly>
        </div>
        <div class="form-group">
          <label>Next Expected Visit</label>
          <input id="followUpNextExpected" readonly>
        </div>
        <div class="form-group">
          <label>Days Since Last Visit</label>
          <input id="followUpDaysSince" readonly>
        </div>
      </div>
      <div class="form-group" style="margin-top:14px;">
        <label>Message</label>
        <textarea id="followUpMessage" class="follow-up-message"></textarea>
      </div>
      <div class="copy-success" id="followUpCopyStatus"></div>
    </div>
    <div class="modal-foot">
      <button class="secondary" type="button" onclick="resetFollowUpMessage()">Reset to Default</button>
      <div style="margin-left:auto;display:flex;gap:8px;">
        <button class="secondary" type="button" onclick="closeFollowUpModal()">Cancel</button>
        <button class="primary" type="button" id="copyFollowUpMessageButton">Copy Message</button>
      </div>
    </div>
  </div>
</div>

<script>
let editingAppointmentId = null;
let activeFollowUpRecordId = null;

function getFollowUpDefaultMessage(){
  return getwellFollowUpSettings().messageTemplate;
}

function copyTextToClipboard(text){
  const value = String(text ?? "");
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(value);
  }
  return new Promise((resolve,reject)=>{
    try{
      const area=document.createElement("textarea");
      area.value=value;
      area.style.position="fixed";
      area.style.left="-9999px";
      document.body.appendChild(area);
      area.focus();
      area.select();
      const ok=document.execCommand("copy");
      area.remove();
      ok ? resolve() : reject(new Error("Copy command failed."));
    }catch(error){ reject(error); }
  });
}

function showFollowUpCopyStatus(message){
  const node=document.getElementById("followUpCopyStatus");
  if(node) node.textContent=message||"";
  if(message) setTimeout(()=>{ if(node) node.textContent=""; },2200);
}

function openFollowUpModal(patientId){
  const record = getwellFollowUpRecords().find(item=>String(item.id)===String(patientId));
  if(!record) return;

  activeFollowUpRecordId = record.id;
  document.getElementById("followUpPatientName").value = record.name || record.id || "";
  document.getElementById("followUpPatientPhone").value = record.phone || "No phone number";
  document.getElementById("followUpStatus").value = record.status || "";
  document.getElementById("followUpLastVisit").value = record.lastVisit || "—";
  document.getElementById("followUpNextExpected").value = record.nextExpectedVisit || "—";
  document.getElementById("followUpDaysSince").value = record.daysSinceLastVisit === null ? "—" : String(record.daysSinceLastVisit);
  const message = document.getElementById("followUpMessage");
  if(message) message.value = getFollowUpDefaultMessage();
  showFollowUpCopyStatus("");
  document.getElementById("followUpModal").classList.add("show");
  setTimeout(()=>message?.focus(),50);
}

function closeFollowUpModal(){
  document.getElementById("followUpModal")?.classList.remove("show");
  activeFollowUpRecordId = null;
}

function resetFollowUpMessage(){
  const message = document.getElementById("followUpMessage");
  if(message) message.value = getFollowUpDefaultMessage();
  showFollowUpCopyStatus("Reset to Default");
}

async function copyFollowUpNumber(){
  const phone = document.getElementById("followUpPatientPhone")?.value || "";
  if(!phone || phone==="No phone number"){
    getwellNotify("This patient does not have a phone number.","error");
    return;
  }
  try{
    await copyTextToClipboard(phone);
    showFollowUpCopyStatus("Number copied!");
    getwellNotify("Number copied!","success");
  }catch(error){
    getwellNotify("Unable to copy the phone number.","error");
  }
}

async function copyFollowUpMessage(){
  const message = document.getElementById("followUpMessage")?.value || "";
  if(!message.trim()){
    getwellNotify("Please enter a message before copying.","error");
    return;
  }
  try{
    await copyTextToClipboard(message);
    showFollowUpCopyStatus("Message copied!");
    getwellNotify("Message copied!","success");
  }catch(error){
    getwellNotify("Unable to copy the message.","error");
  }
}

function renderFollowUpManagement(){
  const records = getwellFollowUpRecords();
  const dueDays = getwellFollowUpSettings().dueAfterDays;
  const counts = {
    soon: records.filter(r=>r.status==="Due Soon").length,
    due: records.filter(r=>r.status==="Due").length,
    overdue: records.filter(r=>r.status==="Overdue").length,
    danger: records.filter(r=>r.status==="High Attention").length
  };

  const summary=document.getElementById("followUpSummary");
  if(summary){
    summary.innerHTML=`
      <div class="follow-up-kpi"><div class="label">DUE SOON</div><div class="value">${counts.soon}</div><div class="sub">Approaching expected follow-up</div></div>
      <div class="follow-up-kpi"><div class="label">DUE</div><div class="value">${counts.due}</div><div class="sub">At the configured due point</div></div>
      <div class="follow-up-kpi"><div class="label">OVERDUE</div><div class="value">${counts.overdue}</div><div class="sub">Past the configured overdue point</div></div>
      <div class="follow-up-kpi"><div class="label">HIGH ATTENTION</div><div class="value">${counts.danger}</div><div class="sub">Significantly overdue for staff contact</div></div>
    `;
  }

  const rows=document.getElementById("followUpRows");
  if(!rows) return;

  rows.innerHTML = records.map(record=>{
    const nextAppt = record.upcomingAppointment;
    const timing = record.status==="Due Soon"
      ? `${Math.max(1, dueDays - record.daysSinceLastVisit)} day(s) to due`
      : record.status==="Due"
        ? "At due point"
        : `${record.daysOverdue} day(s) overdue`;

    return `
      <tr>
        <td>
          <div class="cell-patient">
            <span class="avatar-small">${getwellPatientAvatar(record.patient)}</span>
            <span class="cell-patient-text">
              <strong>${escapeHtml(record.name||record.id||"")}</strong>
              <div class="row-sub">${escapeHtml(record.id||"")}</div>
            </span>
          </div>
        </td>
        <td><span class="follow-up-phone">${escapeHtml(record.phone||"—")}</span></td>
        <td>${escapeHtml(record.lastVisit||"—")}</td>
        <td>${escapeHtml(record.nextExpectedVisit||"—")}</td>
        <td>${nextAppt ? `${escapeHtml(nextAppt.date||"")} ${escapeHtml(nextAppt.time||"")}`.trim() : "None scheduled"}</td>
        <td><span class="follow-up-days ${record.level==='overdue'||record.level==='danger'?'overdue':record.level==='due'?'due':''}">${escapeHtml(timing)}</span></td>
        <td><span class="badge ${record.programmeStatus==="Active"?"green":"gray"}">${escapeHtml(record.programmeStatus||"")}</span></td>
        <td><span class="follow-up-status ${record.level}">${escapeHtml(record.status)}</span></td>
        <td>
          <div class="follow-up-row-action">
            <a class="secondary" style="padding:7px 9px" href="patient-profile.html?patient=${encodeURIComponent(record.id||"")}">Open</a>
            <button class="primary" style="padding:7px 10px" type="button" onclick="openFollowUpModal('${escapeHtml(record.id)}')">Follow Up Now</button>
          </div>
        </td>
      </tr>
    `;
  }).join("") || `<tr><td colspan="9" class="notif-empty">No patients currently require follow-up attention.</td></tr>`;
}

function getAllAppointments(){
  return store().patients
    .flatMap(p => (p.appointments || []).map(a => ({
      ...a,
      patientId:p.id,
      patientName:p.name,
      doctor:a.doctor || p.doctor || ""
    })))
    .sort((a,b) => (`${a.date||""} ${a.time||""}`).localeCompare(`${b.date||""} ${b.time||""}`));
}

function renderAppointmentFormOptions(){
  const doctorEl=document.getElementById("appointmentDoctor");
  const statusEl=document.getElementById("appointmentStatus");
  if(doctorEl){
    doctorEl.innerHTML=`<option value="">Select doctor</option>`+getwellDoctorOptions().map(d=>`<option value="${escapeHtml(d.name)}">${escapeHtml(d.name)}</option>`).join("");
  }
  if(statusEl){
    statusEl.innerHTML=getwellAppointmentStatuses().map(s=>`<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join("");
  }
  const typeEl=document.getElementById("appointmentType");
  if(typeEl){
    typeEl.innerHTML=getwellAppointmentTypes().map(t=>`<option value="${escapeHtml(t.name)}">${escapeHtml(t.name)}</option>`).join("");
  }
}

function setAppointmentPatient(patientId){
  const patient=getPatient(patientId);
  if(!patient) return;
  const patientEl=document.getElementById("appointmentPatient");
  const searchEl=document.getElementById("appointmentPatientSearch");
  const selectedEl=document.getElementById("appointmentPatientSelected");
  const dropdownEl=document.getElementById("appointmentPatientDropdown");
  const doctorEl=document.getElementById("appointmentDoctor");
  if(patientEl) patientEl.value=patient.id;
  if(searchEl) searchEl.value=`${patient.name} · ${patient.id}`;
  if(selectedEl){selectedEl.textContent=`Selected: ${patient.name} · ${patient.id}`;selectedEl.hidden=false;}
  if(dropdownEl){dropdownEl.hidden=true;dropdownEl.style.display="none";}
  if(doctorEl && !doctorEl.value && patient.doctor) doctorEl.value=patient.doctor;
}

function renderAppointmentPatientOptions(query=""){
  const search = String(query||"").trim().toLowerCase();
  const patients = store().patients.filter(patient => {
    const text = `${patient.name||""} ${patient.id||""} ${patient.phone||""}`;
    return !search || text.toLowerCase().includes(search);
  }).slice(0,12);

  document.getElementById("appointmentPatientDropdown").innerHTML = patients.length
    ? patients.map(patient => `
      <button type="button" class="combobox-option"
        onclick="setAppointmentPatient('${escapeHtml(patient.id)}')">
        <strong>${escapeHtml(patient.name)}</strong>
        <span>${escapeHtml(patient.id)}</span>
      </button>
    `).join("")
    : `<div class="combobox-empty">No patients found.</div>`;

  document.getElementById("appointmentPatientDropdown").hidden = false;
  document.getElementById("appointmentPatientDropdown").style.display = "block";
}

function openAddAppointment(){
  editingAppointmentId=null;
  renderAppointmentFormOptions();
  const modal=document.getElementById("appointmentModal");
  const title=document.getElementById("appointmentModalTitle");
  const patient=document.getElementById("appointmentPatient");
  const search=document.getElementById("appointmentPatientSearch");
  const selected=document.getElementById("appointmentPatientSelected");
  const dropdown=document.getElementById("appointmentPatientDropdown");
  const date=document.getElementById("appointmentDate");
  const time=document.getElementById("appointmentTime");
  const doctor=document.getElementById("appointmentDoctor");
  const type=document.getElementById("appointmentType");
  const status=document.getElementById("appointmentStatus");
  const notes=document.getElementById("appointmentNotes");
  if(title) title.textContent="Add Appointment";
  document.getElementById("deleteAppointmentButton").style.display="none";
  if(patient) patient.value="";
  if(search) search.value="";
  if(selected) selected.hidden=true;
  if(dropdown){dropdown.hidden=true;dropdown.style.display="none";}
  if(date) date.value=getwellTodayKey();
  if(time) time.value="";
  if(doctor) doctor.value="";
  if(type) type.value=getwellSystemSettings().appointments.defaultType||getwellAppointmentTypes()[0]?.name||"";
  if(status) status.value=getwellDefaultAppointmentStatus();
  if(notes) notes.value="";
  if(modal) modal.classList.add("show");
}

function openEditAppointment(patientId, appointmentId){
  const patient = getPatient(patientId);
  const appointment = patient?.appointments?.find(a => a.id === appointmentId);
  if(!patient || !appointment) return;

  editingAppointmentId = appointmentId;
  renderAppointmentFormOptions();
  document.getElementById("appointmentModalTitle").textContent = "Edit Appointment";
  document.getElementById("deleteAppointmentButton").style.display = "inline-flex";

  setAppointmentPatient(patient.id);
  document.getElementById("appointmentDate").value = getwellDateKey(appointment.date);
  document.getElementById("appointmentTime").value = appointment.time || "";
  document.getElementById("appointmentDoctor").value = appointment.doctor || patient.doctor || "";
  document.getElementById("appointmentType").value = appointment.type || "";
  document.getElementById("appointmentStatus").value = appointment.status || getwellDefaultAppointmentStatus();
  document.getElementById("appointmentNotes").value = appointment.notes || "";

  document.getElementById("appointmentModal").classList.add("show");
}

async function deleteAppointment(){
  if(!editingAppointmentId) return;
  const patientId=document.getElementById("appointmentPatient")?.value||"";
  const patient=getPatient(patientId);
  if(!patient) return;
  if(!await getwellConfirmDelete("Appointment")) return;
  const removed=(patient.appointments||[]).find(a=>a&&a.id===editingAppointmentId);
  patient.appointments=(patient.appointments||[]).filter(a=>a&&a.id!==editingAppointmentId);
  const saveResult=await upsertPatient(patient);
  getwellLogActivity(
    "Delete",
    "Appointment",
    `${editingAppointmentId} · ${patient.name||patient.id}`,
    removed?`${removed.date||""} ${removed.time||""} ${removed.type||""}`.trim():""
  );
  if(!getwellAnnounceSave(saveResult,"Appointment deleted from Google Sheets.")){
    renderAppointments();
    return;
  }
  closeAppointmentModal();
  renderAppointments();
}

function closeAppointmentModal(){
  document.getElementById("appointmentModal").classList.remove("show");
  document.getElementById("appointmentPatientDropdown").style.display = "none";
  document.getElementById("appointmentPatientDropdown").hidden = true;
  editingAppointmentId = null;
}

/* Async so the Google Sheets write is actually completed
   before the list re-renders, matching Add Patient. */
async function saveAppointment(){
  const patientId=document.getElementById("appointmentPatient")?.value||"";
  if(!patientId){alert("Please select a patient.");return;}
  const patient=getPatient(patientId);
  if(!patient) return;
  if(!Array.isArray(patient.appointments)) patient.appointments=[];
  const existing=editingAppointmentId?patient.appointments.find(a=>a.id===editingAppointmentId):null;
  const appointment={
  ...(existing||{}),
  id:editingAppointmentId||getwellNextAppointmentId(),
  /* Date-only: kept as the picked "YYYY-MM-DD" string. */
  date:getwellDateKey(document.getElementById("appointmentDate")?.value||""),
  time:document.getElementById("appointmentTime")?.value||"",
  doctor:document.getElementById("appointmentDoctor")?.value||"",
  type:(document.getElementById("appointmentType")?.value||"").trim(),
  status:document.getElementById("appointmentStatus")?.value||getwellDefaultAppointmentStatus(),
  notes:(document.getElementById("appointmentNotes")?.value||"").trim(),
  manuallyEdited:!!editingAppointmentId ? true : !!existing?.manuallyEdited,
  source:existing?.source||"manual"
};
  const index=patient.appointments.findIndex(a=>a.id===appointment.id);
  const wasEditing=!!editingAppointmentId;
  if(index>=0) patient.appointments[index]=appointment; else patient.appointments.push(appointment);
  const saveResult=await upsertPatient(patient);
  getwellLogActivity(
    wasEditing?"Edit":"Add",
    "Appointment",
    `${appointment.id} · ${patient.name||patient.id}`,
    `${appointment.date||""} ${appointment.time||""} ${appointment.type||""} · ${appointment.status||""}`.trim()
  );
  if(!getwellAnnounceSave(
      saveResult,
      wasEditing
        ? `Appointment ${appointment.id} updated in Google Sheets.`
        : `Appointment ${appointment.id} saved to Google Sheets.`
    )){
    renderAppointments(document.getElementById("appointmentSearch")?.value||"");
    return;
  }
  closeAppointmentModal();
  renderAppointments(document.getElementById("appointmentSearch")?.value||"");
}

function renderAppointments(q=""){
  const all = getAllAppointments();
  const date = document.getElementById("appointmentFilterDate")?.value || "";
  const search = String(q||"").trim().toLowerCase();

  const rows = all.filter(a => {
    const searchable = `${a.patientName||""} ${a.patientId||""} ${a.type||""} ${a.doctor||""} ${a.status||""}`;
    return (!search || searchable.toLowerCase().includes(search)) &&
           (!date || a.date === date);
  });

  const appointmentRows = document.getElementById("appointmentRows");
  if(appointmentRows){
    appointmentRows.innerHTML = rows.map(a => `
      <tr>
        <td>${escapeHtml(a.date||"—")}</td>
        <td>${escapeHtml(a.time||"—")}</td>
        <td><strong>${escapeHtml(a.patientName||"")}</strong></td>
        <td>${escapeHtml(a.patientId||"")}</td>
        <td>${escapeHtml(a.type||"—")}</td>
        <td>${escapeHtml(a.doctor||"—")}</td>
        <td><span class="badge ${a.status==="Completed"?"green":a.status==="No Show"?"red":a.status==="Cancelled"?"gray":"blue"}">${escapeHtml(a.status||"Upcoming")}</span></td>
        <td><button class="secondary" style="padding:7px 9px" onclick="openEditAppointment('${escapeHtml(a.patientId)}','${escapeHtml(a.id)}')">Edit</button></td>
      </tr>
    `).join("") || `<tr><td colspan="8" class="notif-empty">No appointments found.</td></tr>`;
  }

  const today = getwellTodayKey();
  const appointmentKpis = document.getElementById("appointmentKpis");
  if(appointmentKpis) appointmentKpis.innerHTML = `
    <div class="kpi"><div class="kpi-label">TODAY</div><div class="kpi-value">${all.filter(a=>a.date===today).length}</div></div>
    <div class="kpi"><div class="kpi-label">UPCOMING</div><div class="kpi-value">${all.filter(a=>a.date>=today&&a.status==="Upcoming").length}</div></div>
    <div class="kpi"><div class="kpi-label">COMPLETED</div><div class="kpi-value">${all.filter(a=>a.status==="Completed").length}</div></div>
    <div class="kpi"><div class="kpi-label">NO SHOW</div><div class="kpi-value">${all.filter(a=>a.status==="No Show").length}</div></div>
  `;

  renderFollowUpManagement();
}

document.getElementById("root").innerHTML = shell("Appointments","appointments",`
  <div class="page-head">
    <div></div>
    <button id="addAppointmentButton" class="primary" type="button">＋ Add Appointment</button>
  </div>

  <div class="kpi-grid" id="appointmentKpis"></div>

  <div class="card" style="margin-bottom:15px">
    <div class="card-body">
      <div class="form-grid">
        <div class="form-group"><label>Search</label><input id="appointmentSearch" oninput="renderAppointments(this.value)" placeholder="Patient, ID, doctor or type"></div>
        <div class="form-group"><label>Filter Date</label><input id="appointmentFilterDate" type="date" onchange="renderAppointments(appointmentSearch.value)"></div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:15px">
    <div class="card-head">
      <div>
        <h2>Patients Due for Follow-Up</h2>
        <p>Administrative follow-up attention based on the existing visit and follow-up settings.</p>
      </div>
      <a class="secondary" href="settings.html">Follow-Up Settings</a>
    </div>

    <div class="follow-up-summary" id="followUpSummary"></div>

    <div class="card-body" style="padding-top:0;">
      <div class="table-wrap follow-up-card">
        <table class="table">
          <thead>
            <tr>
              <th>Patient</th>
              <th>Phone</th>
              <th>Last Visit</th>
              <th>Next Expected</th>
              <th>Upcoming Appointment</th>
              <th>Timing</th>
              <th>Programme</th>
              <th>Attention</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="followUpRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><div><h2>Appointment List</h2></div></div>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>ID</th><th>Type</th><th>Doctor</th><th>Status</th><th></th></tr></thead>
        <tbody id="appointmentRows"></tbody>
      </table>
    </div>
  </div>
`);

// Explicit event wiring: do not rely on inline onclick handlers.
// NOTE: the wiring runs FIRST, before any rendering call, so that an
// error inside a render helper can never leave the buttons unwired.
window.openAddAppointment = openAddAppointment;
window.closeAppointmentModal = closeAppointmentModal;
window.saveAppointment = saveAppointment;
window.openEditAppointment = openEditAppointment;
window.openFollowUpModal = openFollowUpModal;
window.closeFollowUpModal = closeFollowUpModal;
window.resetFollowUpMessage = resetFollowUpMessage;
window.copyFollowUpNumber = copyFollowUpNumber;
window.copyFollowUpMessage = copyFollowUpMessage;

const addAppointmentButton = document.getElementById("addAppointmentButton");
const closeAppointmentTop = document.getElementById("closeAppointmentTop");
const closeAppointmentButton = document.getElementById("closeAppointmentButton");
const saveAppointmentButton = document.getElementById("saveAppointmentButton");
if(addAppointmentButton) addAppointmentButton.addEventListener("click", openAddAppointment);
if(closeAppointmentTop) closeAppointmentTop.addEventListener("click", closeAppointmentModal);
if(closeAppointmentButton) closeAppointmentButton.addEventListener("click", closeAppointmentModal);
if(saveAppointmentButton) saveAppointmentButton.addEventListener("click", saveAppointment);
const deleteAppointmentButton=document.getElementById("deleteAppointmentButton");
if(deleteAppointmentButton) deleteAppointmentButton.addEventListener("click",deleteAppointment);

const copyFollowUpNumberButton=document.getElementById("copyFollowUpNumberButton");
const copyFollowUpMessageButton=document.getElementById("copyFollowUpMessageButton");
if(copyFollowUpNumberButton) copyFollowUpNumberButton.addEventListener("click",copyFollowUpNumber);
if(copyFollowUpMessageButton) copyFollowUpMessageButton.addEventListener("click",copyFollowUpMessage);

renderAppointmentFormOptions();
renderAppointments();
if(typeof renderNotifications === "function") renderNotifications();

/* =========================================================
   BACKGROUND SYNC -> IN-PLACE REFRESH

   renderAppointments() reads the search box and the date
   filter straight from the DOM, so both survive the refresh
   untouched along with the follow-up table.

   While the Add/Edit Appointment or Follow Up Now modal is
   open the guard in app.js defers this callback, so the
   selected patient, date, time, doctor, type and notes are
   never cleared underneath the user.
========================================================= */

getwellOnDataUpdated(() => {
  renderAppointments(document.getElementById("appointmentSearch")?.value || "");
  renderNotifications();
});

/* Doctors, appointment types and statuses come from Settings. */
getwellOnSettingsUpdated(() => {
  renderAppointmentFormOptions();
  renderAppointments(document.getElementById("appointmentSearch")?.value || "");
});

document.addEventListener("click", event => {
  const picker = document.querySelector(".patient-picker");
  const menu = document.getElementById("appointmentPatientDropdown");
  if(picker && menu && !picker.contains(event.target)){
    menu.style.display = "none";
    menu.hidden = true;
  }
});
</script>
</body>
</html>
