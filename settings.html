/* =========================================================
   DEEP CLONE
========================================================= */

function deepClone(
  object
){

  return JSON.parse(
    JSON.stringify(
      object
    )
  );

}


/* =========================================================
   MERGE SETTINGS
========================================================= */

function mergeSettings(
  defaults,
  saved
){

  if(
    Array.isArray(
      defaults
    )
  ){

    return Array.isArray(
      saved
    )
      ? saved
      : deepClone(
          defaults
        );

  }


  if(
    defaults &&
    typeof defaults ===
      "object"
  ){

    const result =
      {};


    Object.keys(
      defaults
    )
    .forEach(
      key => {

        result[key] =
          mergeSettings(

            defaults[key],

            saved &&
            saved[key] !==
              undefined

              ? saved[key]

              : defaults[key]

          );

      }
    );


    return result;

  }


  return saved !==
    undefined

      ? saved

      : defaults;

}


/* =========================================================
   GET SETTINGS

   IMPORTANT:
   Existing saved settings may only contain
   the original 5 panels.

   We automatically add the missing panels.
========================================================= */

function getSettings(){

  const raw =
    localStorage.getItem(
      SETTINGS_KEY
    );


  /* -------------------------------------------------------
     NO SAVED SETTINGS
  ------------------------------------------------------- */

  if(!raw){

    const initial =
      deepClone(
        DEFAULT_SETTINGS
      );


    localStorage.setItem(

      SETTINGS_KEY,

      JSON.stringify(
        initial
      )

    );


    return initial;

  }


  /* -------------------------------------------------------
     READ SAVED SETTINGS
  ------------------------------------------------------- */

  try{

    const saved =
      JSON.parse(
        raw
      );


    const result =
      mergeSettings(

        DEFAULT_SETTINGS,

        saved

      );


    /* -----------------------------------------------------
       ADD ANY NEW PANEL THAT DOES NOT EXIST YET

       This prevents the old saved 5-panel configuration
       from blocking the new panels.
    ----------------------------------------------------- */

    const existingPanels =

      Array.isArray(
        result.panels
      )

        ? result.panels

        : [];


    const existingIds =
      new Set(

        existingPanels.map(

          panel =>

            String(
              panel.id
            )
            .toUpperCase()

        )

      );


    /*
      Backfill runs ONCE per browser.

      It used to run on every load, which meant a built-in
      panel the user deleted was silently re-added the next
      time Settings was opened and written back on the next
      Save -- so PMCARE, MiCare and the rest could never
      actually be removed.
    */

    if(saved.panelsBackfilled !== true){

      DEFAULT_SETTINGS.panels
        .forEach(

          defaultPanel => {

            const id =

              String(
                defaultPanel.id
              )
              .toUpperCase();


            if(
              !existingIds.has(
                id
              )
            ){

              existingPanels.push(

                deepClone(
                  defaultPanel
                )

              );

            }

          }

        );

      result.panelsBackfilled = true;

    }else{

      result.panelsBackfilled = true;

    }


    result.panels =
      existingPanels;


    return result;

  }


  catch(error){

    console.error(
      "Unable to read Getwell system settings:",
      error
    );


    return deepClone(
      DEFAULT_SETTINGS
    );

  }

}


/* =========================================================
   SAVE SETTINGS
========================================================= */

function saveSettings(){

  settings.updatedAt = new Date().toISOString();

  localStorage.setItem(
    SETTINGS_KEY,
    JSON.stringify(settings)
  );

  localStorage.setItem(
    SETTINGS_UPDATED_KEY,
    String(Date.now())
  );

  if(typeof getwellRemoteSaveSettings === "function"){
    getwellRemoteSaveSettings(settings).then(result=>{
      if(!result.ok){
        console.error("[Getwell] Settings were saved locally but not to Google Sheets:",result.error);
      }
    });
  }
}

function patientIdPreview(){

  const prefix =
    document.getElementById(
      "patientIdPrefix"
    ).value;


  const digits =
    Math.max(

      1,

      Number(
        document.getElementById(
          "patientIdDigits"
        ).value
      ) || 4

    );


  const number =
    Math.max(

      1,

      Number(
        document.getElementById(

      ) || 1

  document.getElementById(
    "patientIdPreview"

function updatePatientStatusName(
  index,
  value
){

  const clean =
    String(
      value ||
      ""
    )
    .trim();


  if(!clean){

    return;

  }


  const oldName =
    settings.patient
      .statuses[index]
      .name;


  settings.patient
    .statuses[index]
    .name =
      clean;


  if(
    settings.patient
      .defaultStatus ===
    oldName
  ){

    settings.patient
      .defaultStatus =
      clean;

  }


  renderDefaultPatientStatus();

}


function togglePatientStatus(
  index
){

  settings.patient
    .statuses[index]
    .enabled =

    !settings.patient
      .statuses[index]
      .enabled;


  if(
    !settings.patient.statuses
      .some(
        status =>
          status.enabled
      )
  ){

    settings.patient
      .statuses[index]
      .enabled =
      true;

  }


  renderPatientStatuses();

}


function removePatientStatus(
  index
){

  const status =
    settings.patient
      .statuses[index];


  if(
    !confirm(
      `Remove patient status "${status.name}"?`
    )
  ){

    return;

  }


  settings.patient.statuses
    .splice(
      index,
      1
    );


  if(
    !settings.patient.statuses
      .some(
        status =>
          status.enabled
      )
  ){

    settings.patient.statuses[0]
      .enabled =
      true;

  }


  if(
    !settings.patient.statuses
      .some(
        status =>
          status.name ===
            settings.patient.defaultStatus &&
          status.enabled
      )
  ){

    const first =
      settings.patient.statuses
        .find(
          status =>
            status.enabled
        );


    if(first){

      settings.patient.defaultStatus =
        first.name;

    }

  }


  renderPatientStatuses();

}


function addPatientStatus(){

  const name =
    prompt(
      "Enter the new patient status:"
    );


  if(!name){

    return;

  const clean =
    name.trim();


  if(
    settings.patient.statuses

          status.name

          clean.toLowerCase()

    );


    return;

  }


  settings.patient.statuses
    .push({

      name:
        clean,

      enabled:
        true

  renderPatientStatuses();

}

function updatePanelName(
  index,
  value
){

  const clean =
    String(
      value ||
      ""
    )
    .trim();


  if(!clean){

    renderPanels();

    return;

  }


  settings.panels[index]
    .name =
    clean;


  renderPanels();

}


function togglePanel(
  index
){

  settings.panels[index]
    .enabled =

    !settings.panels[index]
      .enabled;


  renderPanels();

}


function removePanel(
  index
){

  const panel =
    settings.panels[index];


  if(
    !confirm(
      `Remove panel "${panel.name}"?`
    )
  ){

    return;

  }


  settings.panels.splice(
    index,
    1
  );


  renderPanels();

}


function addPanel(){

  const name =
    prompt(
      "Enter the new panel provider name:"
    );


  if(!name){

    return;

  }


  const clean =
    name.trim();


  if(!clean){

    return;

  }


  if(
    settings.panels
      .some(
        panel =>
          panel.name
            .toLowerCase() ===
          clean.toLowerCase()
      )
  ){

    alert(
      "That panel already exists."
    );


    return;

  }


  let id =
    clean
      .toUpperCase()
      .replace(
        /[^A-Z0-9]+/g,
        "_"
      );


  /*
    Make sure the generated ID
    is unique.
  */

  const existingIds =
    settings.panels.map(
      panel =>
        String(
          panel.id
        )
        .toUpperCase()
    );


  let originalId =
    id;


  let counter =
    2;


  while(
    existingIds.includes(
      id
    )
  ){

    id =
      `${originalId}_${counter}`;

    counter++;

  }


  settings.panels.push({

    id,

    name:
      clean,

    enabled:
      true

  });


  renderPanels();

}

function loadFollowUp(){
  const f=settings.followUp||{};
  document.getElementById("followUpDue").value=f.dueAfterDays||5;
  document.getElementById("followUpOverdue").value=f.overdueAfterDays||7;
  document.getElementById("followUpDefaultDays").value=f.defaultDays||f.dueAfterDays||5;
  document.getElementById("followUpMinDays").value=f.minDays||1;
  document.getElementById("followUpMaxDays").value=f.maxDays||30;
  const templateEl=document.getElementById("followUpMessageTemplate");
  if(templateEl){
    templateEl.value=f.messageTemplate || getwellFollowUpSettings().messageTemplate || "";
  }
}

function renderAppointmentTypes(){
  const container=document.getElementById("appointmentTypeList");
  if(!container) return;
  if(!Array.isArray(settings.appointments.types)) settings.appointments.types=[];
  container.innerHTML=settings.appointments.types.map((type,index)=>`
    <div class="settings-item">
      <div class="settings-item-main">
        <div class="settings-item-title">${escapeHtml(type.name||"Unnamed")}</div>
        <div class="settings-item-sub">${type.enabled!==false?"Available":"Disabled"}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="secondary" type="button" onclick="editAppointmentType(${index})">Edit</button>
        <button class="secondary" type="button" onclick="toggleAppointmentType(${index})">${type.enabled!==false?"Disable":"Enable"}</button>
        <button class="secondary" type="button" onclick="deleteAppointmentType(${index})">Delete</button>
      </div>
    </div>
  `).join("") || `<div class="notif-empty">No appointment types configured.</div>`;

  const select=document.getElementById("defaultAppointmentType");
  if(select){
    const enabled=settings.appointments.types.filter(x=>x&&x.enabled!==false);
    select.innerHTML=enabled.map(x=>`<option value="${escapeHtml(x.name)}">${escapeHtml(x.name)}</option>`).join("");
    select.value=settings.appointments.defaultType||enabled[0]?.name||"";
  }
}

function addAppointmentType(){
  const name=prompt("Appointment type name:");
  if(!name||!name.trim()) return;
  settings.appointments.types.push({name:name.trim(),enabled:true});
  renderAppointmentTypes();
  saveSettings();
}

function editAppointmentType(index){
  const item=settings.appointments.types[index];
  if(!item) return;
  const name=prompt("Appointment type name:",item.name||"");
  if(!name||!name.trim()) return;
  item.name=name.trim();
  renderAppointmentTypes();
  saveSettings();
}

function toggleAppointmentType(index){
  const item=settings.appointments.types[index];
  if(!item) return;
  item.enabled=item.enabled===false;
  if(settings.appointments.defaultType===item.name && item.enabled===false){
    settings.appointments.defaultType="";
  }
  renderAppointmentTypes();
  saveSettings();
}

function deleteAppointmentType(index){
  const item=settings.appointments.types[index];
  if(!item) return;
  if(!confirm(`Delete appointment type "${item.name}"?`)) return;
  settings.appointments.types.splice(index,1);
  if(settings.appointments.defaultType===item.name) settings.appointments.defaultType="";
  renderAppointmentTypes();
  saveSettings();
}

/* =========================================================
   DOCTORS & CHARGE CATALOG
========================================================= */

function ensureCatalogSettings(){
  if(!Array.isArray(settings.doctors)) settings.doctors = [];
  if(!settings.chargeCatalog || typeof settings.chargeCatalog !== "object"){
    settings.chargeCatalog = {};
  }
  ["Injection","Medication","Treatment","Additional"].forEach(category => {
    if(!Array.isArray(settings.chargeCatalog[category])){
      settings.chargeCatalog[category] = [];
    }
  });
  ensureVisitTypeSettings();
}


/* =========================================================
   VISIT TYPES

   Same add / rename / enable / delete lifecycle as the charge
   catalog above, and stored in the same settings object, so it
   rides the existing Settings -> localStorage -> Settings sheet
   pipeline with no schema change: the Settings sheet holds one
   JSON blob under the key SYSTEM.

   Deleting a type only removes it from the choices offered for
   NEW visits. Every visit already saved keeps working, because
   a visit stores the type NAME on its own row in the Visits
   sheet, and the Add Visit dropdown re-adds any unrecognised
   value as "(not in Settings)" instead of blanking it.
========================================================= */

function ensureVisitTypeSettings(){
  if(!Array.isArray(settings.visitTypes)){
    /*
      A configuration saved by an older build has no
      visitTypes key at all. Seed it from the defaults rather
      than leaving the Add Visit dropdown empty.
    */
    settings.visitTypes = deepClone(DEFAULT_SETTINGS.visitTypes);
  }

  /* Repair rows saved without an id. */
  settings.visitTypes.forEach((type,index) => {
    if(type && !type.id){
      type.id = `VT-${Date.now()}-${index}`;
    }
  });
}

function addVisitType(){
  ensureVisitTypeSettings();
  settings.visitTypes.push({
    id: `VT-${Date.now()}`,
    name: "New Visit Type",
    enabled: true
  });
  renderVisitTypes();
}

function updateVisitType(index,value){
  ensureVisitTypeSettings();
  const item = settings.visitTypes[index];
  if(!item) return;
  item.name = String(value || "").trim();
}

function toggleVisitType(index){
  ensureVisitTypeSettings();
  const item = settings.visitTypes[index];
  if(!item) return;
  item.enabled = item.enabled === false;
  renderVisitTypes();
}

function removeVisitType(index){
  ensureVisitTypeSettings();
  const item = settings.visitTypes[index];
  if(!item) return;

  if(!confirm(
    `Remove the visit type "${item.name || ""}"?\n\n` +
    "It will no longer be offered on new visits. Visits already " +
    "saved with it keep it and are not changed."
  )) return;

  settings.visitTypes.splice(index,1);
  renderVisitTypes();
}

function renderVisitTypes(){
  ensureVisitTypeSettings();
  const container = document.getElementById("visitTypeSettings");
  if(!container) return;

  container.innerHTML = settings.visitTypes.length
    ? settings.visitTypes.map((type,index)=>`
      <div class="settings-item">
        <div class="settings-item-main">
          <div class="settings-item-title">
            <input class="settings-input" data-visit-type-index="${index}"
              value="${escapeHtml(type.name || "")}"
              onchange="updateVisitType(${index}, this.value)">
          </div>
          <div class="settings-item-sub">${type.enabled !== false ? "Available on new visits." : "Hidden from new visits. Existing visits keep it."}</div>
        </div>
        <div class="settings-actions">
          <button class="settings-toggle ${type.enabled !== false ? "on" : ""}"
            onclick="toggleVisitType(${index})"></button>
          <button class="secondary" type="button" onclick="removeVisitType(${index})">Delete</button>
        </div>
      </div>
    `).join("")
    : `<div class="notif-empty">No visit types configured. Click “Add Visit Type”.</div>`;
}

function addDoctor(){
  ensureCatalogSettings();
  settings.doctors.push({
    id: `DR-${Date.now()}`,
    name: "New Doctor",
    enabled: true
  });
  renderDoctors();
}

function updateDoctor(index, value){
  ensureCatalogSettings();
  if(settings.doctors[index]){
    settings.doctors[index].name = value.trim();
  }
}

function toggleDoctor(index){
  ensureCatalogSettings();
  if(settings.doctors[index]){
    settings.doctors[index].enabled = settings.doctors[index].enabled === false;
    renderDoctors();
  }
}

function removeDoctor(index){
  ensureCatalogSettings();
  settings.doctors.splice(index,1);
  renderDoctors();
}

function renderDoctors(){
  ensureCatalogSettings();
  const container = document.getElementById("doctorSettingsList");
  if(!container) return;

  container.innerHTML = settings.doctors.length
    ? settings.doctors.map((doctor,index)=>`
      <div class="settings-item">
        <div class="settings-item-main">
          <div class="settings-item-title">
            <input class="settings-input"
              value="${escapeHtml(doctor.name || "")}"
              onchange="updateDoctor(${index}, this.value)">
          </div>
          <div class="settings-item-sub">Shown in appointment and patient Doctor dropdowns.</div>
        </div>
        <div class="settings-actions">
          <button class="settings-toggle ${doctor.enabled !== false ? "on" : ""}"
            onclick="toggleDoctor(${index})"></button>
          <button class="secondary" type="button" onclick="removeDoctor(${index})">Delete</button>
        </div>
      </div>
    `).join("")
    : `<div class="notif-empty">No doctors configured. Click “Add Doctor”.</div>`;
}

function addChargeItem(category){
  ensureCatalogSettings();
  settings.chargeCatalog[category].push({
    id: `${category.toUpperCase()}-${Date.now()}`,
    name: "New Item",
    price: 0,
    enabled: true
  });
  renderChargeCatalog();
}

function updateChargeItem(category,index,key,value){
  ensureCatalogSettings();
  const item = settings.chargeCatalog[category][index];
  if(!item) return;
  item[key] = key === "price" ? Math.max(0, Number(value) || 0) : value.trim();
}

function toggleChargeItem(category,index){
  ensureCatalogSettings();
  const item = settings.chargeCatalog[category][index];
  if(!item) return;
  item.enabled = item.enabled === false;
  renderChargeCatalog();
}

function removeChargeItem(category,index){
  ensureCatalogSettings();
  settings.chargeCatalog[category].splice(index,1);
  renderChargeCatalog();
}

function renderChargeCatalog(){
  ensureCatalogSettings();
  const container = document.getElementById("chargeCatalogSettings");
  if(!container) return;

  const categories = ["Injection","Medication","Treatment","Additional"];
  container.innerHTML = categories.map(category => `
    <div style="margin-bottom:18px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <strong>${category}</strong>
        <button class="secondary" type="button" onclick="addChargeItem('${category}')">＋ Add Item</button>
      </div>

      ${settings.chargeCatalog[category].length
        ? settings.chargeCatalog[category].map((item,index)=>`
          <div class="settings-item">
            <div class="settings-item-main" style="display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:8px;">
              <input class="settings-input"
                data-charge-category="${category}" data-charge-index="${index}" data-charge-key="name"
                value="${escapeHtml(item.name || "")}"
                onchange="updateChargeItem('${category}',${index},'name',this.value)">
              <input class="settings-input" type="number" min="0" step="0.01"
                data-charge-category="${category}" data-charge-index="${index}" data-charge-key="price"
                value="${Number(item.price)||0}"
                onchange="updateChargeItem('${category}',${index},'price',this.value)">
            </div>
            <div class="settings-actions">
              <button class="settings-toggle ${item.enabled !== false ? "on" : ""}"
                onclick="toggleChargeItem('${category}',${index})"></button>
              <button class="secondary" type="button" onclick="removeChargeItem('${category}',${index})">Delete</button>
            </div>
          </div>
        `).join("")
        : `<div class="notif-empty">No ${category.toLowerCase()} items configured.</div>`
      }
    </div>
  `).join("");
}


/* =========================================================
   SECTION NAVIGATION
========================================================= */

function showSettingsSection(
  section
){

  document
    .querySelectorAll(
      ".settings-section"
    )
    .forEach(

      element => {

        element.hidden =

          element.id !==
          `section-${section}`;

      }

    );


  document
    .querySelectorAll(
      ".settings-tab"
    )
    .forEach(

      button => {

        button.classList.toggle(

          "active",

          button.dataset.section ===
          section

        );

      }

    );

}


/* =========================================================
   SAVE ALL
========================================================= */

function saveAllSettings(){


  /* -------------------------------------------------------
     GENERAL
  ------------------------------------------------------- */

  settings.general.clinicName =

    document.getElementById(
      "clinicName"
    ).value.trim();


  settings.general.clinicLocation =

    document.getElementById(
      "clinicLocation"
    ).value.trim();


  settings.general.contactNumber =

    document.getElementById(
      "contactNumber"
    ).value.trim();


  settings.general.email =

    document.getElementById(
      "clinicEmail"
    ).value.trim();


  settings.general.operatingHours =

    document.getElementById(
      "operatingHours"
    ).value.trim();



  /* -------------------------------------------------------
     PATIENT
  ------------------------------------------------------- */

  settings.patient.idPrefix =

    document.getElementById(
      "patientIdPrefix"
    ).value;


  settings.patient.idDigits =

    Math.max(

      1,

      Number(
        document.getElementById(
          "patientIdDigits"
        ).value
      ) || 4

    );


  settings.patient.nextNumber =

    Math.max(

      1,

      Number(
        document.getElementById(
          "patientNextNumber"
        ).value
      ) || 1

    );


  settings.patient.autoGenerateId =

    document.getElementById(
      "autoGeneratePatientId"
    ).checked;


  settings.patient.defaultStatus =

    document.getElementById(
      "defaultPatientStatus"
    ).value;



  /* -------------------------------------------------------
     DOCTORS & CHARGE CATALOG
  ------------------------------------------------------- */
  ensureCatalogSettings();

  document
    .querySelectorAll("#doctorSettingsList .settings-input")
    .forEach((input,index) => {
      if(settings.doctors[index]){
        settings.doctors[index].name = input.value.trim();
      }
    });

  /*
    VISIT TYPES & CHARGE ITEMS

    The inline onchange handlers already keep `settings` in
    step, but an input that is still focused when Save is
    clicked can miss its change event. Re-reading the fields
    here by their data-* index is what makes "edit a name, hit
    Save, refresh" reliable.
  */
  document
    .querySelectorAll("#visitTypeSettings [data-visit-type-index]")
    .forEach(input => {
      const item = settings.visitTypes[Number(input.dataset.visitTypeIndex)];
      if(item) item.name = input.value.trim();
    });

  document
    .querySelectorAll("#chargeCatalogSettings [data-charge-category]")
    .forEach(input => {
      const list = settings.chargeCatalog[input.dataset.chargeCategory];
      const item = Array.isArray(list) ? list[Number(input.dataset.chargeIndex)] : null;
      if(!item) return;
      if(input.dataset.chargeKey === "price"){
        item.price = Math.max(0, Number(input.value) || 0);
      }else{
        item.name = input.value.trim();
      }
    });

  /* Drop rows the user left completely blank. */
  settings.visitTypes = settings.visitTypes.filter(t => t && String(t.name || "").trim());

  /* -------------------------------------------------------
     APPOINTMENTS
  ------------------------------------------------------- */

  settings.appointments.defaultStatus =

    document.getElementById(
      "defaultAppointmentStatus"
    ).value;


  settings.appointments.defaultType =
    document.getElementById("defaultAppointmentType")?.value || settings.appointments.defaultType || "";

  settings.appointments.defaultDuration =

    Math.max(

      5,

      Number(
        document.getElementById(
          "appointmentDuration"
        ).value
      ) || 30

    );



  /* -------------------------------------------------------
     FOLLOW UP
  ------------------------------------------------------- */

  settings.followUp.dueAfterDays =

    Math.max(

      1,

      Number(
        document.getElementById(
          "followUpDue"
        ).value
      ) || 5

    );


  settings.followUp.overdueAfterDays =

    Math.max(

      1,

      Number(
        document.getElementById(
          "followUpOverdue"
        ).value
      ) || 7

    );



  settings.followUp.defaultDays =
    Math.max(1,Number(document.getElementById("followUpDefaultDays")?.value)||settings.followUp.dueAfterDays||5);

  settings.followUp.minDays =
    Math.max(1,Number(document.getElementById("followUpMinDays")?.value)||1);

  settings.followUp.maxDays =
    Math.max(settings.followUp.minDays,Number(document.getElementById("followUpMaxDays")?.value)||30);

  const followUpMessageEl = document.getElementById("followUpMessageTemplate");
  if(followUpMessageEl){
    const message = followUpMessageEl.value.trim();
    settings.followUp.messageTemplate =
      message || getwellDefaultSystemSettings().followUp.messageTemplate;
  }

  /* -------------------------------------------------------
     SAVE
  ------------------------------------------------------- */

  saveSettings();


  /* Recorded in Administrator -> Activity Log. */
  if(typeof getwellLogActivity === "function"){
    getwellLogActivity(
      "Edit",
      "Settings",
      "System Settings",
      "Clinic, patient ID, panels, doctors, visit types, " +
      "charges, appointments and follow-up settings saved"
    );
  }


  const message =
    document.getElementById(
      "saveMessage"
    );


  message.textContent =
    "✓ Settings saved successfully.";


  setTimeout(

    () => {

      message.textContent =
        "";

    },

    3000

  );

}


/* =========================================================
   CANCEL
========================================================= */

function reloadSettings(){

  settings =
    getSettings();


  loadEverything();

}


/* =========================================================
   LOAD EVERYTHING
========================================================= */

function loadEverything(){

  loadGeneral();

  loadPatientSettings();

  ensureCatalogSettings();
  renderDoctors();
  renderVisitTypes();
  renderChargeCatalog();

  renderPanels();

  renderAppointmentStatuses();
  renderAppointmentTypes();


  document.getElementById(
    "appointmentDuration"
  ).value =
    settings.appointments
      .defaultDuration;


  loadFollowUp();

  renderDashboardOptions();

  renderReportOptions();

  renderFeatureOptions();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
){

  return String(
    value ??
    ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   INITIALIZE
========================================================= */

loadEverything();


showSettingsSection(
  "general"
);


/* =========================================================
   BACKGROUND SYNC ON THE SETTINGS PAGE

   This page is the settings EDITOR, so it is deliberately the
   one page that is never re-rendered by a background sync.
   Re-running loadEverything() here would throw away whatever
   the user had typed and jump the tab strip back to General.

   getwellSyncRemoteStore() in app.js already knows not to
   overwrite GETWELL_SYSTEM_CONFIG_V1 while settings.html is
   open. All that happens here is a one-line, non-blocking
   notice; the user decides when to pick the change up by
   pressing Cancel, which reloads the configuration from
   storage without touching the page structure.

   The open section, every input, and every unsaved edit are
   left exactly as they are.
========================================================= */

let getwellSettingsNoticeShown = false;

document.addEventListener("getwell:settings-updated", () => {
  if(getwellSettingsNoticeShown) return;
  getwellSettingsNoticeShown = true;

  getwellNotify(
    "Settings were changed elsewhere. Your edits on this page are untouched — " +
    "press Cancel to load the newer configuration, or Save Changes to keep yours.",
    "info"
  );
});

</script>
