function deepClone(
  object
){

  return JSON.parse(
    JSON.stringify(
      object
    )
  );

}


function getSettings(){

  const raw =
    localStorage.getItem(
      SETTINGS_KEY
    );


  if(!raw){

    localStorage.setItem(
      SETTINGS_KEY,
      JSON.stringify(
        DEFAULT_SETTINGS
      )
    );


    return deepClone(
      DEFAULT_SETTINGS
    );

  }


  try{

    const saved =
      JSON.parse(
        raw
      );


    return mergeSettings(
      DEFAULT_SETTINGS,
      saved
    );

  }catch(error){

    console.error(
      error
    );


    return deepClone(
      DEFAULT_SETTINGS
    );

  }

}


function mergeSettings(
  defaults,
  saved
){

  if(
    Array.isArray(
      defaults
    )
  ){

    return Array.isArray(
      saved
    )
      ? saved
      : deepClone(
          defaults
        );

  }


  if(
    defaults &&
    typeof defaults ===
      "object"
  ){

    const result = {};


    Object.keys(
      defaults
    )
    .forEach(
      key => {

        result[key] =
          mergeSettings(
            defaults[key],
            saved &&
            saved[key] !==
              undefined
              ? saved[key]
              : defaults[key]
          );

      }
    );


    return result;

  }


  return saved !==
    undefined
      ? saved
      : defaults;

}

/* =========================================================
   PATIENT ID
========================================================= */

function patientIdPreview(){

  const prefix =
    document.getElementById(
      "patientIdPrefix"
    ).value;


  const digits =
    Math.max(
      1,
      Number(
        document.getElementById(
          "patientIdDigits"
        ).value
      ) || 4
    );


  const number =
    Math.max(
      1,
      Number(
        document.getElementById(
          "patientNextNumber"
        ).value
      ) || 1
    );


  document.getElementById(
    "patientIdPreview"
  ).textContent =
    prefix +
    String(
      number
    )
    .padStart(
      digits,
      "0"
    );

}


function loadPatientSettings(){

  document.getElementById(
    "patientIdPrefix"
  ).value =
    settings.patient.idPrefix;


  document.getElementById(
    "patientIdDigits"
  ).value =
    settings.patient.idDigits;


  document.getElementById(
    "patientNextNumber"
  ).value =
    settings.patient.nextNumber;


  document.getElementById(
    "autoGeneratePatientId"
  ).checked =
    settings.patient.autoGenerateId;


  patientIdPreview();


  [
    "patientIdPrefix",
    "patientIdDigits",
    "patientNextNumber"
  ]
  .forEach(
    id =>
      document
        .getElementById(id)
        .addEventListener(
          "input",
          patientIdPreview
        )
  );


  renderPatientStatuses();

}


/* =========================================================
   PATIENT STATUS
========================================================= */

function renderPatientStatuses(){

  const container =
    document.getElementById(
      "patientStatusList"
    );


  container.innerHTML =
    settings.patient.statuses
      .map(
        (
          status,
          index
        ) => `

        <div class="settings-item">

          <div class="settings-item-main">

            <div class="settings-item-title">

              <input
                class="settings-input"
                value="${escapeHtml(
                  status.name
                )}"
                onchange="
                  updatePatientStatusName(
                    ${index},
                    this.value
                  )
                "
              >

            </div>

            <div class="settings-item-sub">
              Used throughout patient management.
            </div>

          </div>


          <div class="settings-actions">

            <button
              class="
                settings-toggle
                ${
                  status.enabled
                    ? "on"
                    : ""
                }
              "
              onclick="
                togglePatientStatus(
                  ${index}
                )
              "
              aria-label="Toggle status"
            ></button>


            ${
              settings.patient.statuses.length > 1
                ? `
                  <button
                    class="
                      settings-small-button
                      settings-danger
                    "
                    onclick="
                      removePatientStatus(
                        ${index}
                      )
                    "
                  >
                    Remove
                  </button>
                `
                : ""
            }

          </div>

        </div>

      `
      )
      .join("");


  renderDefaultPatientStatus();

}


function updatePatientStatusName(
  index,
  value
){

  const clean =
    String(
      value || ""
    )
    .trim();


  if(!clean)
    return;


  const oldName =
    settings.patient
      .statuses[index]
      .name;


  settings.patient
    .statuses[index]
    .name =
      clean;


  if(
    settings.patient
      .defaultStatus ===
      oldName
  ){

    settings.patient
      .defaultStatus =
      clean;

  }


  renderDefaultPatientStatus();

}


function togglePatientStatus(
  index
){

  const status =
    settings.patient
      .statuses[index];


  status.enabled =
    !status.enabled;


  /*
    Always keep at least one
    enabled patient status.
  */

  if(
    !settings.patient
      .statuses
      .some(
        s => s.enabled
      )
  ){

    status.enabled =
      true;

  }


  renderPatientStatuses();

}


function removePatientStatus(
  index
){

  const status =
    settings.patient
      .statuses[index];


  if(
    !confirm(
      `Remove patient status "${status.name}"?`
    )
  ){

    return;

  }


  settings.patient
    .statuses
    .splice(
      index,
      1
    );


  const enabled =
    settings.patient
      .statuses
      .find(
        s => s.enabled
      );


  if(
    !enabled
  ){

    settings.patient
      .statuses[0]
      .enabled =
      true;

  }


  if(
    !settings.patient
      .statuses
      .some(
        s =>
          s.name ===
          settings.patient
            .defaultStatus &&
          s.enabled
      )
  ){

    settings.patient
      .defaultStatus =
      settings.patient
        .statuses
        .find(
          s => s.enabled
        )
        .name;

  }


  renderPatientStatuses();

}

function updatePanelName(
  index,
  value
){

  const clean =
    String(
      value || ""
    )
    .trim();


  if(!clean)
    return;


  settings.panels[
    index
  ].name =
    clean;

}


function togglePanel(
  index
){

  settings.panels[
    index
  ].enabled =
    !settings.panels[
      index
    ].enabled;


  renderPanels();

}


function removePanel(
  index
){

  const panel =
    settings.panels[
      index
    ];


  if(
    !confirm(
      `Remove panel "${panel.name}"?`
    )
  ){

    return;

  }


  settings.panels.splice(
    index,
    1
  );


  renderPanels();

}


function addPanel(){

  const name =
    prompt(
      "Enter the new panel provider name:"
    );


  if(!name)
    return;


  const clean =
    name.trim();


  if(
    settings.panels
      .some(
        panel =>
          panel.name.toLowerCase() ===
          clean.toLowerCase()
      )
  ){

    alert(
      "That panel already exists."
    );

    return;

  }


  const id =
    clean
      .toUpperCase()
      .replace(
        /[^A-Z0-9]+/g,
        "_"
      );


  settings.panels.push({

    id,

    name:
      clean,

    enabled:
      true

  });


  renderPanels();

}

function showSettingsSection(
  section
){

  document
    .querySelectorAll(
      ".settings-section"
    )
    .forEach(
      element => {

        element.hidden =
          element.id !==
          `section-${section}`;

      }
    );


  document
    .querySelectorAll(
      ".settings-tab"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.section ===
            section
        );

      }
    );

}

========================================================= */

function saveAllSettings(){

  /*
    GENERAL
  */

  settings.general.clinicName =
    document.getElementById(
      "clinicName"
    ).value.trim();


  settings.general.clinicLocation =
    document.getElementById(
      "clinicLocation"
    ).value.trim();


  settings.general.contactNumber =
    document.getElementById(
      "contactNumber"
    ).value.trim();


  settings.general.email =
    document.getElementById(
      "clinicEmail"
    ).value.trim();


  settings.general.operatingHours =
    document.getElementById(
      "operatingHours"
    ).value.trim();


  /*
    PATIENT
  */

  settings.patient.idPrefix =
    document.getElementById(
      "patientIdPrefix"
    ).value;


  settings.patient.idDigits =
    Math.max(
      1,
      Number(
        document.getElementById(
          "patientIdDigits"
        ).value
      ) || 4
    );


  settings.patient.nextNumber =
    Math.max(
      1,
      Number(
        document.getElementById(
          "patientNextNumber"
        ).value
      ) || 1
    );


  settings.patient.autoGenerateId =
    document.getElementById(
      "autoGeneratePatientId"
    ).checked;


  settings.patient.defaultStatus =
    document.getElementById(
      "defaultPatientStatus"
    ).value;


  /*
    APPOINTMENTS
  */

  settings.appointments.defaultStatus =
    document.getElementById(
      "defaultAppointmentStatus"
    ).value;


  settings.appointments.defaultDuration =
    Math.max(
      5,
      Number(
        document.getElementById(
          "appointmentDuration"
        ).value
      ) || 30
    );


  /*
    FOLLOW UP
  */

  settings.followUp.dueAfterDays =
    Math.max(
      1,
      Number(
        document.getElementById(
          "followUpDue"
        ).value
      ) || 5
    );


  settings.followUp.overdueAfterDays =
    Math.max(
      1,
      Number(
        document.getElementById(
          "followUpOverdue"
        ).value
      ) || 7
    );


  /*
    SAVE
  */

  saveSettings();


  const message =
    document.getElementById(
      "saveMessage"
    );


  message.textContent =
    "✓ Settings saved successfully.";


  setTimeout(
    () => {

      message.textContent =
        "";

    },
    3000
  );

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}
