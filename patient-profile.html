/* =========================================================
   TAB SWITCHING
========================================================= */

function showTab(
  tab,
  button
){

  document
    .querySelectorAll(
      "[id^='section-']"
    )
    .forEach(section => {

      section.style.display =
        "none";

    });


  const target =
    document.getElementById(
      "section-" + tab
    );


  if(target){

    target.style.display =
      "block";

  }


  document
    .querySelectorAll(
      ".patient-tabs button"
    )
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });


  if(button){

    button.classList.add(
      "active"
    );

  }


  if(tab === "composition"){

    renderComposition();

  }

}

/* =========================================================
   MONEY
========================================================= */

function money(
  value
){

  return "RM " +
    Number(
      value || 0
    ).toLocaleString(
      "en-MY",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}

function renderOverviewVisits(){

  const container =

  const visits =
    patient.visits || [];


  if(!visits.length){

    container.innerHTML = `

      <div class="notif-empty">

  container.innerHTML =

      .slice(0,8)

/* =========================================================
   VISIT TOTAL VALIDATION
========================================================= */

function calculateVisitTotal(){

  return (

    Number(
      document.getElementById(
        "vInjectionPrice"
      ).value || 0
    )

    +

    Number(
      document.getElementById(
        "vMedicationPrice"
      ).value || 0
    )

    +

    Number(
      document.getElementById(
        "vTreatmentPrice"
      ).value || 0
    )

    +

    Number(
      document.getElementById(
        "vAdditionalPrice"
      ).value || 0
    )

  );

}



function updateVisitTotal(){

  const total =
    calculateVisitTotal();


  document.getElementById(
    "vTotal"
  ).textContent =
    money(total);


  const panel =
    Number(
      document.getElementById(
        "vPanel"
      ).value || 0
    );


  const selfPay =
    Number(
      document.getElementById(
        "vSelf"
      ).value || 0
    );


  const validation =
    document.getElementById(
      "vValidation"
    );


  if(
    !patientUsesPanel(
      patient
    )
  ){

    document.getElementById(
      "vPanel"
    ).value =
      0;


    document.getElementById(
      "vSelf"
    ).value =
      total;


    validation.className =
      "badge green";


    validation.textContent =
      "Self-Pay patient: full visit total is assigned to Self-Pay.";

    return true;

  }


  const difference =
    Math.abs(
      total -
      (
        panel +
        selfPay
      )
    );


  if(
    difference < 0.001
  ){

    validation.className =
      "badge green";


    validation.textContent =
      `${getPanelName(
        patient
      )} + Self-Pay / Co-Payment matches the Visit Total.`;


    return true;

  }


  validation.className =
    "badge red";


  validation.textContent =
    `${getPanelName(
      patient
    )} + Self-Pay / Co-Payment must equal ${money(
      total
    )}.`;


  return false;

}



/* =========================================================

========================================================= */

[
  "vInjectionPrice",

]

    if(element){

/* =========================================================
   SAVE VISIT
========================================================= */

function saveVisitRecord(){

  const date =
    document.getElementById(
      "vDate"
    ).value;


  const type =
    document.getElementById(
      "vType"
    ).value.trim();


  if(!date){

    alert(
      "Please select the visit date."
    );

    return;
  }


  if(!type){

    alert(
      "Please enter the visit type."
    );

    return;
  }


  if(
    !updateVisitTotal()
  ){

    return;

  }


  const total =
    calculateVisitTotal();


  const panel =
    Number(
      document.getElementById(
        "vPanel"
      ).value || 0
    );


  const selfPay =
    Number(
      document.getElementById(
        "vSelf"
      ).value || 0
    );


  const pdf =
    document.getElementById(
      "vPdf"
    ).files[0];


  const front =
    document.getElementById(
      "vFront"
    ).files[0];


  const side =
    document.getElementById(
      "vSide"
    ).files[0];


  const back =
    document.getElementById(
      "vBack"
    ).files[0];


  const billing = {

    injection:{

      price:
        Number(
          document.getElementById(
            "vInjectionPrice"
          ).value || 0
        ),

      notes:
        document.getElementById(
          "vInjectionNotes"
        ).value.trim()

    },


    medication:{

      price:
        Number(
          document.getElementById(
            "vMedicationPrice"
          ).value || 0
        ),

      notes:
        document.getElementById(
          "vMedicationNotes"
        ).value.trim()

    },


    treatment:{

      price:
        Number(
          document.getElementById(
            "vTreatmentPrice"
          ).value || 0
        ),

      notes:
        document.getElementById(
          "vTreatmentNotes"
        ).value.trim()

    },


    other:{

      price:
        Number(
          document.getElementById(
            "vAdditionalPrice"
          ).value || 0
        ),

      notes:
        (
          document.getElementById(
            "vAdditional"
          ).value.trim()
          +
          (
            document.getElementById(
              "vAdditionalNotes"
            ).value.trim()
              ? " · " +
                document.getElementById(
                  "vAdditionalNotes"
                ).value.trim()
              : ""
          )
        )

    },


    panel:
      patientUsesPanel(
        patient
      )
        ? panel
        : 0,


    selfPay:
      patientUsesPanel(
        patient
      )
        ? selfPay
        : total,


    panelClaimAmount:0,

    panelClaimDate:"",

    coverageType:
      patientUsesPanel(
        patient
      )
        ? "panel"
        : "self"

  };


  const visitData = {

    id:
      editingVisitId ||
      `${patient.id}-V${Date.now()}`,

    dateKey:
      date,

    visit:
      document.getElementById(
        "vNumber"
      ).value.trim(),

    type:
      type,

    weight:
      "—",

    injection:
      document.getElementById(
        "vInjection"
      ).value.trim(),

    dose:
      document.getElementById(
        "vDose"
      ).value.trim(),

    medication:
      document.getElementById(
        "vMedication"
      ).value.trim(),

    additionalTreatment:
      document.getElementById(
        "vTreatment"
      ).value.trim(),

    notes:
      document.getElementById(
        "vNotes"
      ).value.trim(),

    pdfName:
      pdf
        ? pdf.name
        : editingVisitId
          ? (
              patient.visits.find(
                visit =>
                  visit.id ===
                  editingVisitId
              )?.pdfName ||
              ""
            )
          : "",


    photos:{

      front:
        front
          ? front.name
          : "",

      side:
        side
          ? side.name
          : "",

      back:
        back
          ? back.name
          : ""

    },


    status:
      "Completed",


    billing:
      billing

  };



  /* =======================================================
     EDIT EXISTING
  ======================================================== */

  if(editingVisitId){

    const index =
      patient.visits.findIndex(
        visit =>
          visit.id ===
          editingVisitId
      );


    if(index >= 0){

      /* Preserve old claim amount/date */

      const oldVisit =
        patient.visits[index];


      billing.panelClaimAmount =
        oldVisit.billing?.panelClaimAmount ||
        0;


      billing.panelClaimDate =
        oldVisit.billing?.panelClaimDate ||
        "";


      patient.visits[index] =
        visitData;

    }


  }else{

    patient.visits.unshift(
      visitData
    );

  }



  /* =======================================================
     SAVE
  ======================================================== */

  upsertPatient(
    patient
  );


  patient =
    getPatient(
      patientId
    );


  closeVisitModal();


  refreshAll();


  renderNotifications();

}

  }

/* =========================================================
   SAVE PANEL CLAIM
========================================================= */

function saveClaim(
  visitId
){

  const visit =
    patient.visits.find(
      item =>
        item.id ===
        visitId
    );


  if(!visit){
    return;
  }


  const billing =
    ensureVisit(
      visit
    ).billing;


  const amountInput =
    document.getElementById(
      `claim-${visitId}`
    );


  const dateInput =
    document.getElementById(
      `claimDate-${visitId}`
    );


  const amount =
    Number(
      amountInput?.value || 0
    );


  const eligible =
    panelEligible(
      visit
    );


  if(amount < 0){

    alert(
      "Claim amount cannot be negative."
    );

    return;
  }


  if(amount > eligible){

    alert(
      "Claim amount cannot exceed the Panel / Insurance amount for this visit."
    );

    return;
  }


  billing.panelClaimAmount =
    amount;


  billing.panelClaimDate =
    dateInput?.value || "";


  upsertPatient(
    patient
  );


  patient =
    getPatient(
      patientId
    );


  refreshAll();


  renderNotifications();

}



/* =========================================================
   EDIT PATIENT
========================================================= */

function editPatient(){

  const currentPanel =
    patient.panelProvider ||
    "SELF_PAY";


  const nextPanel =
    prompt(
      "Enter payment type:\n\nSELF_PAY\nPANEL_A\nPANEL_B\nPANEL_C\nOther",
      currentPanel
    );


  if(
    nextPanel === null
  ){
    return;
  }


  const normalized =
    nextPanel
      .trim();


  if(
    ![
      "SELF_PAY",
      "PANEL_A",
      "PANEL_B",
      "PANEL_C",
      "Other"
    ].includes(
      normalized
    )
  ){

    alert(
      "Please enter one of the available payment types."
    );

    return;
  }


  patient.panelProvider =
    normalized;


  if(
    normalized ===
    "Other"
  ){

    const customPanel =
      prompt(
        "Enter panel name:",
        patient.otherPanelName ||
          ""
      );


    if(
      customPanel === null
    ){

      return;

    }


    patient.otherPanelName =
      customPanel.trim();

  }else{

    patient.otherPanelName =
      "";

  }


  upsertPatient(
    patient
  );


  refreshAll();

}

   REFRESH EVERYTHING
